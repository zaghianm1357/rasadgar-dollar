<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12181e">
<title>رصدگر دلار — نسخه موبایل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- پایه ---------- */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --bg:#12181e; --fg:#e8ecf0; --card:#1c232b; --muted:#272f39; --mutedfg:#a0aab4;
  --primary:#34d399; --border:rgba(255,255,255,.09);
  --emerald:#34d399; --emerald-d:#10b981; --rose:#fb7185; --rose-d:#f43f5e;
  --amber:#fbbf24; --amber-d:#f59e0b; --amber-l:#fcd34d; --zinc:#a1a1aa;
  --sky:#38bdf8; --violet:#a78bfa; --red:#f87171; --teal:#2dd4bf;
}
body{
  min-height:100dvh;background:#0a0e13;color:var(--fg);
  font-family:'Vazirmatn',-apple-system,'Segoe UI',Tahoma,sans-serif;
  font-size:14px;line-height:1.55;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
a{color:var(--primary)}
[dir="ltr"]{unicode-bidi:isolate}
.ms-auto{margin-inline-start:auto}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}
.no-scrollbar::-webkit-scrollbar{display:none}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}

/* ---------- صحنه و قاب ---------- */
#stage{min-height:100dvh;display:flex;align-items:center;justify-content:center}
#device{
  position:relative;width:100%;height:100dvh;overflow:hidden;background:var(--bg);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
@media (min-width:640px){
  #device{
    width:400px;height:min(840px,94dvh);border-radius:48px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 40px 90px -24px rgba(0,0,0,.85);
  }
}

/* کاغذدیواری با پارالاکس */
#wall{position:absolute;inset:-10%;will-change:transform}
.wall-a{position:absolute;inset:0;background:
  radial-gradient(120% 85% at 88% -8%, rgba(13,148,136,.5), transparent 58%),
  radial-gradient(95% 75% at 8% 108%, rgba(79,70,229,.45), transparent 55%),
  linear-gradient(180deg,#182230,#10161d)}
.wall-b{position:absolute;inset:0;background:
  radial-gradient(3px 3px at 20% 30%, rgba(255,255,255,.16), transparent),
  radial-gradient(2px 2px at 70% 18%, rgba(255,255,255,.12), transparent),
  radial-gradient(2px 2px at 42% 62%, rgba(255,255,255,.1), transparent),
  radial-gradient(3px 3px at 85% 70%, rgba(255,255,255,.08), transparent)}

/* ---------- نوار وضعیت ---------- */
#statusbar{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 20px}
.sb-clock{display:flex;align-items:center;gap:6px;border-radius:999px;padding:2px 8px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;transition:background .2s}
.sb-clock:active{background:rgba(255,255,255,.1)}
.sb-right{display:flex;align-items:center;gap:6px;color:rgba(232,236,240,.85)}
.sb-batt,.sb-menu{border-radius:999px;padding:2px;transition:background .2s}
.sb-batt:active,.sb-menu:active{background:rgba(255,255,255,.1)}
.sb-menu{padding:3px 4px}

/* ---------- صفحات ---------- */
#pages{
  position:absolute;left:0;right:0;top:44px;bottom:104px;
  display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
}
.page{height:100%;width:100%;flex:0 0 100%;scroll-snap-align:center;overflow-y:auto;overscroll-behavior-y:contain}
.page-inner{display:flex;flex-direction:column;gap:12px;min-height:100%;padding:12px 16px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.page-note{text-align:center;font-size:9px;color:rgba(160,170,180,.6);margin:0}

/* ---------- ویجت‌ها ---------- */
.widget{
  display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);
  background:rgba(28,35,43,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:16px;padding:12px;min-width:0;
}
.w-row{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.w-title{font-size:10px;font-weight:700;color:var(--mutedfg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-big{font-size:18px;font-weight:800;line-height:24px;font-variant-numeric:tabular-nums}
.w-sub{font-size:10px;color:rgba(160,170,180,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-chg{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.w-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.w-head-t{font-size:10px;font-weight:800}
.w-note{font-size:9px;color:rgba(160,170,180,.7);margin:0}
.col2{grid-column:span 2}
.chg-up{color:var(--emerald)} .chg-down{color:var(--rose)} .chg-flat{color:var(--zinc)} .chg-none{color:var(--mutedfg)}

/* نشان روند کوچک */
.tdot{display:inline-flex;align-items:center;gap:2px;border:1px solid;border-radius:4px;padding:1px 4px;font-size:9px;font-weight:700;white-space:nowrap}
.tdot.bull{color:var(--emerald);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.1)}
.tdot.bear{color:var(--rose);border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.1)}
.tdot.neut{color:var(--zinc);border-color:rgba(161,161,170,.3);background:rgba(161,161,170,.1)}
.tdot.na{color:var(--mutedfg);border-color:var(--border);background:rgba(39,47,57,.3)}

/* جدول کوچک ویجت‌ها */
.mini-tbl{width:100%;border-collapse:collapse;text-align:center;overflow:hidden;border-radius:8px;border:1px solid rgba(255,255,255,.06)}
.mini-tbl th{background:rgba(39,47,57,.4);font-size:9px;color:var(--mutedfg);padding:4px 6px;font-weight:700}
.mini-tbl th:first-child{text-align:right}
.mini-tbl td{padding:4px 6px;border-top:1px solid rgba(255,255,255,.05)}
.mini-tbl td:first-child{text-align:right;font-size:9px;font-weight:700;color:var(--mutedfg)}

/* ---------- بنر تغییر جهت ---------- */
.banner{border-radius:12px;border:1px solid rgba(245,158,11,.6);background:rgba(245,158,11,.05);padding:12px;display:flex;flex-direction:column;gap:10px;animation:fade-up .4s ease-out both}
.banner.blink{animation:fade-up .4s ease-out both, alert-blink 1.2s ease-in-out infinite}
.bnr-head{display:flex;align-items:center;gap:8px}
.bnr-ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border-radius:8px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.15);color:var(--amber)}
.bnr-t1{font-size:13px;font-weight:800;line-height:20px;color:var(--amber-l);margin:0}
.bnr-t2{font-size:10px;line-height:16px;color:var(--mutedfg);margin:0}
.bnr-x{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:8px;border:1px solid var(--border);color:var(--mutedfg)}
.bnr-rows{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:4px;border:1px solid rgba(255,255,255,.06);background:rgba(18,24,30,.5);border-radius:8px;padding:6px 10px}
.crow-sym{font-size:11px;font-weight:800}
.crow-tf{font-size:10px;color:var(--mutedfg)}
.crow-time{margin-inline-start:auto;font-size:9px;color:rgba(160,170,180,.8);font-variant-numeric:tabular-nums}
.crow-arrow{font-size:11px;font-weight:700;color:var(--mutedfg)}
.bnr-extra{padding:0 4px;font-size:10px;font-weight:700;color:rgba(251,191,36,.9);margin:0}

/* چیپ‌های عمومی */
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;white-space:nowrap}
.chip.bull{color:var(--emerald);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.12)}
.chip.bear{color:var(--rose);border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.12)}
.chip.neut{color:var(--zinc);border-color:rgba(161,161,170,.3);background:rgba(161,161,170,.12)}
.chip.na{color:var(--mutedfg);border-color:var(--border);background:rgba(39,47,57,.3)}
.chip.impH{color:var(--red);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.12)}
.chip.impM{color:var(--amber);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.12)}
.chip.impL{color:var(--zinc);border-color:rgba(161,161,170,.3);background:rgba(161,161,170,.12)}
.chip.impO{color:var(--teal);border-color:rgba(45,212,191,.3);background:rgba(45,212,191,.12)}
.chip.st{color:var(--mutedfg);border-color:var(--border);background:rgba(39,47,57,.4)}
.chip.sugB{color:var(--emerald);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.15)}
.chip.sugS{color:var(--rose);border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.15)}
.chip.sugW{color:var(--amber);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.15)}

/* ---------- گرید آیکون‌ها ---------- */
.icongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.icongrid.wiggling-grid{border:1px dashed rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:12px;padding:8px}
.appbtn{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:12px;padding:4px;transition:opacity .2s}
.appbtn.dragging{opacity:.25}
.appbtn.wig-touch{touch-action:none}
.icon-vis{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:15px;box-shadow:0 10px 15px -3px rgba(0,0,0,.4)}
.icon-vis.sm{width:46px;height:46px}
.icon-vis.g-news{background:linear-gradient(135deg,#10b981,#0f766e)}
.icon-vis.g-structure{background:linear-gradient(135deg,#0ea5e9,#4338ca)}
.icon-vis.g-suggestion{background:linear-gradient(135deg,#8b5cf6,#a21caf)}
.icon-vis.g-about{background:linear-gradient(135deg,#71717a,#3f3f46)}
.icon-vis.g-nc{border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.15);color:var(--amber-l)}
.icon-vis.g-cc{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);color:var(--fg)}
.icon-label{font-size:10px;font-weight:700;line-height:12px;color:rgba(232,236,240,.9);text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* ---------- داک و ناوبری ---------- */
#dock{position:absolute;left:12px;right:12px;bottom:36px;z-index:20}
.dock-in{display:flex;align-items:center;justify-content:space-around;border-radius:28px;border:1px solid rgba(255,255,255,.1);padding:10px 8px;
  backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);background:rgba(30,38,47,.72)}
#dots{position:absolute;left:0;right:0;bottom:92px;z-index:20;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{height:6px;width:6px;border-radius:999px;background:rgba(255,255,255,.3);transition:all .3s}
.dot.on{width:16px;background:rgba(255,255,255,.85)}
#homebar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:36px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;cursor:pointer}
.homebar-pill{height:6px;width:112px;border-radius:999px;background:rgba(255,255,255,.45)}

/* ---------- حالت لرزش ---------- */
@keyframes wiggle{0%,100%{transform:rotate(-1.6deg) scale(1.04)}50%{transform:rotate(1.6deg) scale(1.04)}}
.wiggling-icon{display:block;animation:wiggle .3s ease-in-out infinite}
#wiggle-done{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.15);backdrop-filter:blur(12px);padding:6px 16px;font-size:12px;font-weight:800}
#wiggle-done:active{background:rgba(255,255,255,.25)}
#drag-ghost{position:fixed;z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-50%) scale(1.18);pointer-events:none}
.ghost-label{border-radius:6px;background:rgba(0,0,0,.6);padding:2px 6px;font-size:10px;font-weight:700}

/* ---------- راهنمای اولیه ---------- */
@keyframes hint-fade{0%,72%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
#hint{position:absolute;left:24px;right:24px;bottom:104px;z-index:40;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.55);backdrop-filter:blur(12px);padding:10px 12px;text-align:center;font-size:10px;line-height:20px;animation:hint-fade 9s ease forwards}

/* ---------- مراکز اعلان/کنترل ---------- */
.center-layer{position:absolute;inset:0;z-index:70;pointer-events:none}
.center-back{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0}
.frost{backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);background:rgba(30,38,47,.72)}
.spring{transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .3s ease}
.nc-sheet{position:absolute;left:0;right:0;top:0;max-height:85%;overflow-y:auto;border-radius:0 0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);padding:12px 16px 16px;transform:translateY(-100%)}
.cc-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;border-top:1px solid rgba(255,255,255,.1);padding:16px 16px 24px;transform:translateY(100%)}
.grabber{width:40px;height:4px;border-radius:999px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.nc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.nc-clock{font-size:24px;font-weight:800;line-height:32px;margin:0;font-variant-numeric:tabular-nums}
.nc-date{font-size:10px;color:var(--mutedfg);margin:0}
.nc-close{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1)}
.nc-sec{border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);padding:12px;margin-bottom:12px}
.nc-sec-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.nc-sec-t{font-size:11px;font-weight:800;margin:0}
.nc-sec-p{font-size:11px;line-height:20px;color:var(--mutedfg);margin:0}
.st-row{display:flex;align-items:center;gap:8px;font-size:11px;line-height:20px}
.st-k{color:var(--mutedfg)}
.st-v{margin-inline-start:auto;font-weight:700;text-align:left}
.cc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cc-title{font-size:12px;font-weight:800;margin:0}
.cc-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.cc-grid{grid-template-columns:1fr 1fr}}
.cc-tile{display:flex;align-items:center;gap:8px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);padding:12px;text-align:right;width:100%}
.cc-tile:active{background:rgba(255,255,255,.14)}
.cc-ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border-radius:12px;border:1px solid}
.cc-label{min-width:0;flex:1;font-size:10px;font-weight:700;line-height:16px;text-align:right}
.sw{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--emerald-d)}
.sw.on::after{transform:translateX(-16px)}
.cc-note{text-align:center;font-size:9px;color:rgba(160,170,180,.7);margin:12px 0 0}
.cc-src{font-size:9px;line-height:16px;color:var(--mutedfg);margin:4px 0 0}
.stat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.stat-chip{border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.06);padding:3px 10px;font-size:10px;font-weight:700}

/* ---------- منوی جانبی ---------- */
#drawer-layer{position:absolute;inset:0;z-index:80;pointer-events:none}
#drawer-layer.on{pointer-events:auto}
#drawer-back{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0}
#drawer-panel{position:absolute;top:0;bottom:0;right:0;width:min(80%,304px);display:flex;flex-direction:column;gap:10px;overflow-y:auto;border-radius:0 0 0 26px;border-left:1px solid rgba(255,255,255,.12);padding:16px 14px 14px;transform:translateX(108%)}
.drawer-head{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.drawer-logo{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(135deg,#10b981,#0f766e);color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.4)}
.drawer-t{font-size:15px;font-weight:800;margin:0;line-height:22px}
.drawer-s{font-size:9px;color:var(--mutedfg);margin:0}
.drawer-sec-t{font-size:9px;font-weight:800;letter-spacing:.4px;color:rgba(160,170,180,.75);margin:6px 4px 0}
.drawer-item{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:14px;padding:8px 10px;transition:transform .1s}
.drawer-item:active{transform:scale(.98);background:rgba(255,255,255,.1)}
.drawer-item-t{min-width:0;flex:1;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-item .ic{color:rgba(160,170,180,.8)}
.drawer-status{display:flex;align-items:center;gap:6px;font-size:10px;line-height:16px;color:var(--mutedfg);margin:0}
.drawer-status b{color:var(--fg)}
.drawer-foot{font-size:8px;line-height:14px;color:rgba(160,170,180,.6);text-align:center;margin:4px 0 0}

/* ---------- شیت اپ ---------- */
#app-sheet{position:absolute;inset:0;z-index:60;overflow:hidden;background:var(--bg);transform-origin:top left}
#app-topbar{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:8px;height:48px;padding:0 10px}
#app-topbar>*{position:relative;z-index:1}
#app-topbar::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,24,30,.96) 45%,rgba(18,24,30,0));pointer-events:none}
.app-tb-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(30,38,47,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg)}
.app-tb-btn:active{background:rgba(255,255,255,.2)}
#app-title{min-width:0;flex:1;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.65)}
#app-scroll{position:absolute;inset:0;overflow-y:auto;padding:56px 0 32px}
#app-homebar{position:absolute;left:0;right:0;bottom:0;height:32px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;cursor:pointer}
.app-pad{padding:0 16px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* ---------- کارت‌ها و اجزای اپ‌ها ---------- */
.card{border:1px solid var(--border);background:rgba(28,35,43,.9);border-radius:12px}
.card-p{padding:14px 16px}
.tile{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border-radius:8px;border:1px solid}
.tile.p{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.12);color:var(--primary)}
.tile.a{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.12);color:var(--amber)}
.tile.sk{border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.12);color:var(--sky)}
.tile.v{border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.12);color:var(--violet)}
.tile.g{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.12);color:var(--emerald)}
.tile.n{border-color:var(--border);background:rgba(39,47,57,.5);color:var(--fg)}
.stats{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{display:flex;align-items:center;gap:10px;padding:12px}
.stat-k{font-size:10px;color:var(--mutedfg);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-v{font-size:13px;font-weight:700;line-height:20px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-s{font-size:9px;color:rgba(160,170,180,.8);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.digest{border-color:rgba(52,211,153,.25);background:linear-gradient(225deg,rgba(52,211,153,.08),transparent)}
.digest-t{font-size:13px;font-weight:700;color:var(--primary);margin:0}
.digest-p{font-size:12px;line-height:24px;color:rgba(232,236,240,.9);margin:6px 0 0}

.tabs-list{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(39,47,57,.4);border-radius:10px;padding:4px}
.tab{height:30px;border-radius:8px;font-size:12px;color:var(--mutedfg);display:flex;align-items:center;justify-content:center}
.tab.on{background:var(--card);color:var(--fg);font-weight:700}
.fchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fchip{display:inline-flex;align-items:center;height:32px;border-radius:999px;border:1px solid var(--border);padding:0 12px;font-size:11px;color:var(--mutedfg)}
.fchip.on{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.15);font-weight:700;color:var(--primary)}

.pending-note{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(39,47,57,.3);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--mutedfg)}
.day-h{display:flex;align-items:center;gap:10px;margin:2px 0}
.day-h h2{font-size:12px;font-weight:700;color:rgba(232,236,240,.9);margin:0;white-space:nowrap}
.day-line{height:1px;flex:1;background:var(--border)}
.day-n{font-size:10px;color:var(--mutedfg);white-space:nowrap}
.ev{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid rgba(255,255,255,.09);background:rgba(28,35,43,.9);border-radius:12px;animation:fade-up .4s ease-out both}
.ev-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ev-time{display:inline-flex;align-items:center;border-radius:6px;background:rgba(39,47,57,.6);padding:4px 10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.ev-title{font-size:16px;font-weight:700;line-height:26px;margin:0}
.ev-en{direction:ltr;text-align:left;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:rgba(160,170,180,.8);margin:0}
.ev-exp{border:1px solid var(--border);background:rgba(18,24,30,.5);border-radius:8px;padding:12px}
.ev-exp p{font-size:13px;line-height:24px;margin:0;color:rgba(232,236,240,.9)}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{display:flex;flex-direction:column;align-items:center;border:1px solid var(--border);background:rgba(39,47,57,.4);border-radius:8px;padding:6px 12px;min-width:72px}
.vchip.hi{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1)}
.vchip-k{font-size:10px;color:var(--mutedfg)}
.vchip-v{direction:ltr;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.vchip.hi .vchip-v{color:var(--emerald)}
.aimp{border:1px solid var(--border);background:rgba(18,24,30,.4);border-radius:8px;overflow:hidden}
.aimp-h{display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(39,47,57,.4);padding:6px 10px;font-size:11px;font-weight:700;color:rgba(232,236,240,.9)}
.aimp-tbl{width:100%;border-collapse:collapse;text-align:center}
.aimp-tbl th{font-size:9px;color:var(--mutedfg);padding:6px 4px;font-weight:500}
.aimp-tbl th:first-child{text-align:right;padding-right:8px}
.aimp-tbl td{border-top:1px solid rgba(255,255,255,.05);padding:8px 4px}
.aimp-tbl td:first-child{text-align:right;padding-right:8px}
.a-name{font-size:11px;font-weight:700}
.a-mono{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--mutedfg)}
.aimp-prob{border-top:1px solid rgba(255,255,255,.05);background:rgba(39,47,57,.2);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.prob-t{font-size:9px;font-weight:700;color:var(--mutedfg)}
.prob-l{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:10px;line-height:16px}
.prob-k{color:var(--mutedfg)}
.prob-up{color:var(--emerald);font-weight:700}
.prob-dn{color:var(--rose);font-weight:700}
.prob-alt{color:rgba(160,170,180,.7)}
.prob-note{font-size:9px;line-height:16px;color:rgba(160,170,180,.8)}
.ev-warn{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(251,191,36,.9)}

/* ---------- اپ ساختار بازار ---------- */
.ms-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ms-head-t{font-size:14px;font-weight:800;line-height:20px;margin:0}
.ms-head-s{font-size:10px;color:var(--mutedfg);margin:0}
.badge{display:inline-flex;align-items:center;border-radius:999px;border:1px solid;padding:2px 8px;font-size:10px;font-weight:700}
.badge.live{color:var(--emerald);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.1)}
.badge.snap{color:var(--amber);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.1)}
.iconbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04)}
.iconbtn:active{background:rgba(255,255,255,.1)}
.spin{animation:spin-rot 1s linear infinite}
@keyframes spin-rot{to{transform:rotate(360deg)}}
.sym-heads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sym-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);background:rgba(39,47,57,.25);border-radius:8px;padding:8px 10px}
.sym-n{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sym-mono{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--mutedfg)}
.sym-p{direction:ltr;text-align:left;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.sym-c{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.ms-tbl{width:100%;border-collapse:collapse;text-align:center;overflow:hidden;border-radius:8px;border:1px solid var(--border)}
.ms-tbl th{background:rgba(39,47,57,.4);font-size:10px;color:var(--mutedfg);padding:8px 6px;font-weight:700}
.ms-tbl th:first-child{text-align:right;padding-right:8px}
.ms-tbl td{border-top:1px solid rgba(255,255,255,.05);padding:10px 4px}
.ms-tbl td.tf{text-align:right;padding-right:8px;font-size:11px;font-weight:700}
.tf-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.tf-pill{display:inline-flex;align-items:center;gap:4px;border:1px solid;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.tf-pill.bull{color:var(--emerald);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.12)}
.tf-pill.bear{color:var(--rose);border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.12)}
.tf-pill.neut{color:var(--zinc);border-color:rgba(161,161,170,.3);background:rgba(161,161,170,.12)}
.tf-pill.na{color:var(--mutedfg);border-color:var(--border);background:rgba(39,47,57,.3)}
.tf-str{font-size:9px;font-weight:700;color:var(--mutedfg)}
.tf-desc{font-size:9px;line-height:12px;color:rgba(160,170,180,.7)}
.sum-line{font-size:10px;line-height:16px;color:var(--mutedfg);margin:0}
.sum-line b.b{color:var(--emerald)} .sum-line b.s{color:var(--rose)} .sum-line b.n{color:var(--zinc)}
.ms-note{font-size:9px;line-height:16px;color:rgba(160,170,180,.7);margin:0}

/* ---------- پیشنهاد معامله ---------- */
.sug{display:flex;flex-direction:column;gap:10px;border:1px solid rgba(52,211,153,.25);background:rgba(52,211,153,.05);border-radius:8px;padding:12px}
.sug-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sug-t{font-size:12px;font-weight:800}
.sug-s{font-size:9px;color:var(--mutedfg)}
.sug-sels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel-k{font-size:9px;font-weight:700;color:var(--mutedfg)}
.sel{width:100%;height:32px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--fg);font:inherit;font-size:12px;padding:0 8px;appearance:none;-webkit-appearance:none}
.sug-logic{font-size:9px;line-height:16px;color:rgba(160,170,180,.8);margin:0}
.sug-cards{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.sug-cards{grid-template-columns:1fr 1fr}}
.sug-card{display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);background:rgba(18,24,30,.4);border-radius:8px;padding:10px}
.sug-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sug-chips{display:flex;flex-wrap:wrap;gap:6px}
.sug-reason{font-size:9px;line-height:16px;color:var(--mutedfg);margin:0}

/* ---------- اپ درباره ---------- */
.about-sec{border:1px solid var(--border);background:rgba(28,35,43,.7);border-radius:16px;padding:14px}
.about-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.about-t{font-size:13px;font-weight:800;margin:0}
.about-p{font-size:11px;line-height:22px;color:var(--mutedfg);margin:0}
.about-li{font-size:11px;line-height:20px;color:var(--mutedfg)}
.about-foot{text-align:center;font-size:9px;line-height:16px;color:rgba(160,170,180,.7);padding:0 8px;margin:0}

/* ---------- دکمه‌ها ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;background:rgba(255,255,255,.04);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;pointer-events:none}
.empty{border:1px dashed var(--border);border-radius:12px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty p{font-size:12px;color:var(--mutedfg);margin:0}

/* ---------- اپ چارت TradingView ---------- */
.icon-vis.g-chart{background:linear-gradient(135deg,#f59e0b,#92400e)}
.chart-wrap{display:flex;flex-direction:column;gap:8px;height:100%;padding:0 8px 12px}
.chart-chips{display:flex;gap:6px;overflow-x:auto;flex:none}
.chart-tfrow{display:flex;align-items:center;gap:6px;flex:none}
.chart-tfrow .chart-chips{flex:1;min-width:0}
.tv-login{flex:none;border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.15);color:#bae6fd;font-weight:800;gap:4px}
.tv-login:active{transform:scale(.96)}
.cchip{display:inline-flex;align-items:center;height:28px;flex:none;border-radius:999px;border:1px solid var(--border);padding:0 10px;font-size:11px;color:var(--mutedfg);background:rgba(39,47,57,.4);white-space:nowrap;transition:transform .1s}
.cchip:active{transform:scale(.96)}
.cchip.on{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.14);color:var(--amber);font-weight:700}
#tv_chart{position:relative;flex:1;min-height:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#131722}
#tv_chart iframe{display:block;width:100%;height:100%;border:0}
.tv-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.tv-loading{font-size:12px;font-weight:700;color:var(--mutedfg)}
.tv-err-ic{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.12);color:var(--red)}
.tv-err-t{font-size:14px;font-weight:800;margin:0}
.tv-err-s{font-size:11px;line-height:20px;color:var(--mutedfg);margin:0}
.chart-note{font-size:9px;line-height:14px;color:rgba(160,170,180,.7);text-align:center;margin:0;flex:none}
/* تحلیل هوشمند (موتور محلی) */
.ai-btn{flex:none;border-color:rgba(167,139,250,.5);background:rgba(139,92,246,.16);color:#ddd6fe;font-weight:800;gap:4px}
.ai-btn:active{transform:scale(.96)}
.ai-btn[disabled]{opacity:.6}
#ai_panel{display:flex;flex-direction:column;flex:none;height:38%;max-height:300px;border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(49,46,129,.18);overflow:hidden}
.ai-head{display:flex;align-items:center;gap:6px;flex:none;padding:7px 10px;border-bottom:1px solid var(--border);color:#ddd6fe}
.ai-head .t{flex:1;min-width:0;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-head .at{flex:none;font-size:9px;color:var(--mutedfg)}
.ai-x,.ai-rf{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:8px;border:1px solid var(--border);background:rgba(39,47,57,.4);color:var(--mutedfg)}
.ai-rf:active,.ai-x:active{transform:scale(.94)}
.ai-body{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 2px;font-size:11px;line-height:20px;color:var(--fg)}
.ai-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;min-height:90px;text-align:center;color:var(--mutedfg);font-size:11px;font-weight:700;padding:10px}
.ai-sec{margin:0 0 7px}
.ai-sec b{color:#c4b5fd}
.ai-stale{margin:0 0 7px;padding:4px 8px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);border-radius:8px;color:#fde68a;font-size:10px;font-weight:700;text-align:center}
.ai-foot{flex:none;padding:0 10px 7px;font-size:9px;line-height:14px;color:rgba(160,170,180,.7);text-align:center;margin:0}

/* ---------- انیمیشن‌ها ---------- */
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fade-up .4s ease-out both}
@keyframes soft-pulse{0%,100%{opacity:1}50%{opacity:.45}}
.soft-pulse{animation:soft-pulse 2s ease-in-out infinite}
@keyframes alert-blink{
  0%,100%{border-color:rgba(251,191,36,.85);box-shadow:0 0 0 1px rgba(251,191,36,.35),0 0 18px 2px rgba(251,191,36,.28);background-color:rgba(251,191,36,.1)}
  50%{border-color:rgba(251,191,36,.25);box-shadow:0 0 0 1px rgba(251,191,36,.08),0 0 8px 0 rgba(251,191,36,.1);background-color:rgba(251,191,36,.04)}
}
@keyframes widget-pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(52,211,153,.4)}45%{transform:scale(1.035);box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.wpulse{animation:widget-pulse .7s ease-out}
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  .wiggling-icon,.wpulse,.banner.blink{animation:none}
  .banner.blink{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.08);box-shadow:none}
}
</style>
</head>
<body>
<div id="stage">
  <div id="device" aria-label="رصدگر دلار — نسخه موبایل">

    <!-- کاغذدیواری با پارالاکس -->
    <div id="wall" aria-hidden="true">
      <div class="wall-a"></div>
      <div class="wall-b"></div>
    </div>

    <!-- نوار وضعیت -->
    <div id="statusbar">
      <button type="button" id="sb-clock" class="sb-clock" aria-label="باز کردن مرکز اعلان‌ها">--:--</button>
      <div class="sb-right" id="sb-right"></div>
    </div>

    <!-- صفحات -->
    <div id="pages" class="no-scrollbar">
      <section class="page no-scrollbar" id="page1"><div class="page-inner" id="page1-inner"></div></section>
      <section class="page no-scrollbar" id="page2"><div class="page-inner grid2" id="page2-inner"></div></section>
    </div>

    <!-- نقطه‌های صفحه -->
    <div id="dots"></div>

    <!-- داک -->
    <div id="dock"><div class="dock-in" id="dock-in"></div></div>

    <!-- نوار خانه -->
    <div id="homebar" role="button" tabindex="0" aria-label="نوار خانه">
      <div class="homebar-pill"></div>
    </div>

    <!-- دکمه پایان حالت لرزش -->
    <button type="button" id="wiggle-done" hidden data-nogesture>
      <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      پایان
    </button>

    <!-- راهنمای اولیه -->
    <div id="hint" hidden>
      دکمه <b>☰</b> (بالا-چپ) منوی جانبی — دکمه <b>→</b> در هر اپ: بازگشت — دکمه برگشت خود گوشی هم کار می‌کند
    </div>

    <!-- منوی جانبی -->
    <div id="drawer-layer">
      <div id="drawer-back"></div>
      <div id="drawer-panel" class="frost no-scrollbar"></div>
    </div>

    <!-- مرکز اعلان‌ها -->
    <div class="center-layer" id="nc-layer">
      <div class="center-back" id="nc-back"></div>
      <div class="nc-sheet frost spring no-scrollbar" id="nc-sheet"></div>
    </div>

    <!-- مرکز کنترل -->
    <div class="center-layer" id="cc-layer">
      <div class="center-back" id="cc-back"></div>
      <div class="cc-sheet frost spring no-scrollbar" id="cc-sheet"></div>
    </div>

    <!-- شبح آیکون در حال جابه‌جایی -->
    <div id="drag-ghost" hidden></div>

    <!-- شیت اپ با انیمیشن بزرگ‌نمایی -->
    <div id="app-sheet" hidden>
      <div id="app-topbar" data-nogesture>
        <button type="button" id="app-back" aria-label="بازگشت به صفحه قبل">
          <svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <span id="app-title"></span>
        <button type="button" id="app-menu" aria-label="باز کردن منوی جانبی">
          <svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>
      <div id="app-scroll" class="no-scrollbar"></div>
      <div id="app-homebar" role="button" tabindex="0" aria-label="بستن اپ">
        <div class="homebar-pill" style="background:rgba(255,255,255,.4)"></div>
      </div>
    </div>

var S = {
  gridOrder: (function () {
    var order = DEFAULT_ORDER.slice();
    try {
      var raw = lsGet(GRID_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          /* ادغام سازگار با نسخه قبل: ترتیب ذخیره‌شده حفظ و اپ‌های جدید به انتها اضافه می‌شوند */
          var merged = [];
          for (var i = 0; i < arr.length; i++)
            if (DEFAULT_ORDER.indexOf(arr[i]) >= 0 && merged.indexOf(arr[i]) < 0) merged.push(arr[i]);
          for (var j = 0; j < order.length; j++)
            if (merged.indexOf(order[j]) < 0) merged.push(order[j]);
          if (merged.length === order.length) return merged;
        }
      }
    } catch (e) {}
    return order;
  })(),
  wiggle: false,

/* ---------- لایه‌های تاریخچه — پشتیبانی از دکمه برگشت خود گوشی ----------
 * باز شدن هر لایه (اپ/منو/مراکز) یک ورودی history اضافه می‌کند؛
 * دکمه برگشت گوشی یا سوایپ برگشت iOS بالاترین لایه را می‌بندد.
 */
var lastPushed = null;
function pushLayer(name) {
  lastPushed = name;
  try { history.pushState({ sd: name }, ''); } catch (e) { lastPushed = null; }
}
function topOpenLayer() {
  if (S.drawerOpen) return 'drawer';
  if (S.ncOpen) return 'nc';
  if (S.ccOpen) return 'cc';
  if (S.app && S.appPhase !== 'closing') return 'app';
  return null;
}
function closeByName(name) {
  if (name === 'drawer') closeDrawerNow();
  else if (name === 'app') closeApp();
  else if (name === 'nc') closeNC();
  else if (name === 'cc') closeCC();
}
function closeLayerUI(name) {
  if (!name) return;
  if (lastPushed === name) {
    lastPushed = null;
    try { history.back(); } catch (e) { closeByName(name); }
  } else {
    closeByName(name);
  }
}
window.addEventListener('popstate', function () {
  lastPushed = null;
  var t = topOpenLayer();
  if (t) closeByName(t);
});

/* ---------- مرکز اعلان‌ها / کنترل ---------- */
function showNC() { renderNC(); S.ncOpen = true; setNC(1); }
function showCC() { renderCC(); S.ccOpen = true; setCC(1); }
function commitNC() { if (S.ncOpen) return; showNC(); pushLayer('nc'); }
function commitCC() { if (S.ccOpen) return; showCC(); pushLayer('cc'); }
function setNC(v) { S.ncProgress = Math.max(0, Math.min(1, v)); applyCenter(ncLayer, ncBack, ncSheet, S.ncProgress, true); }
function setCC(v) { S.ccProgress = Math.max(0, Math.min(1, v)); applyCenter(ccLayer, ccBack, ccSheet, S.ccProgress, false); }
function applyCenter(layer, back, panel, progress, fromTop) {
  layer.style.pointerEvents = progress > 0 ? 'auto' : 'none';
  back.style.opacity = progress;
  panel.style.transform = fromTop
    ? 'translateY(' + ((progress - 1) * 100).toFixed(2) + '%)'
    : 'translateY(' + ((1 - progress) * 100).toFixed(2) + '%)';
  if (progress === 0 || progress === 1) panel.classList.add('spring');
  else panel.classList.remove('spring');
}
function openNC() { commitNC(); }
function closeNC() { S.ncOpen = false; setNC(0); }
function openCC() { commitCC(); }
function closeCC() { S.ccOpen = false; setCC(0); }

/* ---------- منوی جانبی ---------- */
function setDrawer(v) {
  S.drawerProgress = Math.max(0, Math.min(1, v));
  drawerLayer.classList.toggle('on', S.drawerProgress > 0);
  drawerBack.style.opacity = S.drawerProgress;
  drawerPanel.style.transform = 'translateX(' + ((1 - S.drawerProgress) * 108).toFixed(2) + '%)';
  if (S.drawerProgress === 0 || S.drawerProgress === 1) drawerPanel.classList.add('spring');
  else drawerPanel.classList.remove('spring');
}
function openDrawer() {
  if (S.drawerOpen) return;
  if (S.ncOpen) closeNC();
  if (S.ccOpen) closeCC();
  renderDrawer();
  S.drawerOpen = true;
  setDrawer(1);
  buzz();
  pushLayer('drawer');
}
function closeDrawerNow() { S.drawerOpen = false; setDrawer(0); }
function navFromDrawer(kind, id) {
  /* بستن منو بدون تغییر تاریخچه — ورودی منو با replaceState به مقصد تبدیل می‌شود */
  S.drawerOpen = false;
  setDrawer(0);
  var name = kind === 'app' ? 'app' : kind;
  try { history.replaceState({ sd: name }, ''); lastPushed = name; } catch (e) {}
  buzz();
  if (kind === 'app') openApp(id, null, true);
  else if (kind === 'nc') showNC();
  else if (kind === 'cc') showCC();
}
drawerBack.addEventListener('click', function () { closeLayerUI('drawer'); });
drawerPanel.addEventListener('click', function (e) {

  if (nav) { navFromDrawer(nav.dataset.dnav, nav.dataset.id); return; }
  var act = e.target.closest('[data-dact]');
  if (act && act.dataset.dact === 'refresh-prices') refreshPrices();
});

/* حرکات کشیدن از بالا/پایین روی سطح قاب */
device.addEventListener('pointerdown', function (e) {
  if (S.wiggle || S.drag || S.gesture || S.drawerOpen || S.ncOpen || S.ccOpen) return;
  if (e.target.closest('[data-nogesture]')) return;
  var rect = device.getBoundingClientRect();
  var y = e.clientY - rect.top;
  var inApp = !!S.app && S.appPhase !== 'closing';
  if (y < 46 || y > rect.height - 44) {
    /* لمس دکمه‌ها در نوار وضعیت/نوار خانه → کلیک مستقیم؛ حرکت شروع نشود تا setPointerCapture کلیک را نبلعد */
    if (e.target.closest('button,[role="button"],a,select,input,textarea')) return;
  }
  if (y < 46) {
    S.gesture = { type: 'nc', startY: e.clientY, id: e.pointerId };
    try { device.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (y > rect.height - 44) {
    S.gesture = { type: inApp ? 'close-app' : 'cc', startY: e.clientY, id: e.pointerId };
    try { device.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
device.addEventListener('pointermove', function (e) {
  var g = S.gesture;
  if (!g || e.pointerId !== g.id) return;
  var dy = e.clientY - g.startY;
  if (g.type === 'nc') setNC(dy / 150);
  else if (g.type === 'cc') setCC(-dy / 170);
});
device.addEventListener('pointerup', function (e) {
  var g = S.gesture;
  S.gesture = null;
  if (!g || e.pointerId !== g.id) return;
  if (g.type === 'nc') { if (S.ncProgress > 0.4) { S.ncOpen = false; commitNC(); } else { S.ncOpen = false; setNC(0); } }
  else if (g.type === 'cc') { if (S.ccProgress > 0.4) { S.ccOpen = false; commitCC(); } else { S.ccOpen = false; setCC(0); } }
  else if (g.type === 'close-app') { if (e.clientY - g.startY < -36 && S.app && S.appPhase !== 'closing') closeLayerUI('app'); }
});
device.addEventListener('pointercancel', function () {
  S.gesture = null;
  setNC(S.ncOpen ? 1 : 0);
  setCC(S.ccOpen ? 1 : 0);
});

/* ---------- اجرای اپ با انیمیشن بزرگ‌نمایی (FLIP) ---------- */
function applySheetGeom(animate) {
  var spring = 'transform .42s cubic-bezier(.32,.72,0,1), border-radius .42s cubic-bezier(.32,.72,0,1)';
  if (S.app && S.appPhase !== 'open') {
    var r = S.app.rect;
    sheet.style.transition = animate ? spring : 'none';
    sheet.style.transform = 'translate(' + r.x + 'px,' + r.y + 'px) scale(' + (r.w / r.dw).toFixed(4) + ',' + (r.h / r.dh).toFixed(4) + ')';
    sheet.style.borderRadius = '22px';
  } else {
    sheet.style.transition = spring;
    sheet.style.transform = 'none';
    sheet.style.borderRadius = '0px';
  }
}
function openApp(id, srcEl, noPush) {
  if (!srcEl) { srcEl = dockIn.querySelector('[data-app="' + id + '"]'); }
  var d = device.getBoundingClientRect();
  var r = srcEl ? srcEl.getBoundingClientRect() : d;
  buzz();
  S.app = {
    id: id,
    rect: { x: r.left - d.left, y: r.top - d.top, w: r.width, h: r.height, dw: d.width, dh: d.height }
  };
  S.appPhase = 'opening';
  renderApp(id);
  sheet.hidden = false;
  applySheetGeom(false);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { S.appPhase = 'open'; applySheetGeom(true); });
  });
  if (!noPush) pushLayer('app');
}
function closeApp() {
  if (!S.app || S.appPhase === 'closing') return;
  S.appPhase = 'closing';
  applySheetGeom(true);
  setTimeout(function () { sheet.hidden = true; S.app = null; S.appPhase = 'closed'; }, 430);
}

function renderIconGhost(id, x, y) {
  ghost.hidden = false;
  ghost.style.left = x + 'px';
  ghost.style.top = y + 'px';
  ghost.innerHTML = iconVisHTML(id, 52) + '<span class="ghost-label">' + APPS[id].label + '</span>';
}
function page1IconPointerDown(id, e) {
  e.stopPropagation();
  if (S.wiggle) {
    S.drag = { id: id, x: e.clientX, y: e.clientY };
    renderIconGhost(id, e.clientX, e.clientY);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  } else {
    var self = e.currentTarget;
    S.press = {
      id: id, startX: e.clientX, startY: e.clientY, longFired: false,
      timer: setTimeout(function () {
        S.wiggle = true;
        if (S.press) S.press.longFired = true;
        buzz();
        refreshWiggleUI();
      }, LONG_PRESS_MS)
    };
    try { self.setPointerCapture(e.pointerId); } catch (err) {}
  }
}
function page1IconPointerMove(id, e) {
  if (S.wiggle) {
    if (!S.drag || S.drag.id !== id) return;
    S.drag.x = e.clientX; S.drag.y = e.clientY;
    renderIconGhost(id, e.clientX, e.clientY);
    var order = S.gridOrder;
    var target = -1;
    for (var i = 0; i < order.length; i++) {
      var el = iconGridEl().querySelector('[data-icon="' + order[i] + '"] .icon-vis');
      if (!el) continue;
      var r = el.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right) { target = i; break; }
    }
    var cur = order.indexOf(id);
    if (target >= 0 && target !== cur) {
      var next = order.slice();
      next.splice(cur, 1);
      next.splice(target, 0, id);
      S.gridOrder = next;
      renderIconsGrid();
    }
    return;
  }
  var p = S.press;
  if (p && p.id === id) {
    if (Math.hypot(e.clientX - p.startX, e.clientY - p.startY) > 10) cancelLongPress();
  }
}
function page1IconPointerUp(id) {
  cancelLongPress();
  if (S.drag) {
    lsSet(GRID_KEY, JSON.stringify(S.gridOrder));
    S.drag = null;
    ghost.hidden = true;
    buzz();
  }
}
function page1IconClick(id) {
  if (S.press && S.press.longFired) { S.press.longFired = false; return; }
  if (S.wiggle) return;
  var el = iconGridEl().querySelector('[data-icon="' + id + '"]');
  openApp(id, el);
}
$('#wiggle-done').addEventListener('click', function () {
  S.wiggle = false;
  lsSet(GRID_KEY, JSON.stringify(S.gridOrder));
  refreshWiggleUI();
});
function refreshWiggleUI() {
  $('#wiggle-done').hidden = !S.wiggle;
  renderIconsGrid();
}

/* ---------- بروزرسانی زنده قیمت‌ها (پروکسی عمومی — تلاش نهاایی) ---------- */
var priceState = { mode: 'snapshot', lastTry: null, trying: false, okAt: null };
var PROXIES = [
  function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
  function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
  function (u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); }
];
function fetchJSON(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); reject(new Error('timeout')); }, timeoutMs || 9000);
    fetch(url, { signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (j) { clearTimeout(t); resolve(j); })
      .catch(function (err) { clearTimeout(t); reject(err); });
  });
}
function fetchYahooPrice(sym) {
  var u = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(sym) + '?range=1d&interval=1m';
  var i = 0;
  function attempt() {
    if (i >= PROXIES.length) return Promise.resolve(null);
    var p = PROXIES[i++];
    return fetchJSON(p(u), 9000).then(function (j) {
      var r = j && j.chart && j.chart.result && j.chart.result[0];
      if (!r || !r.meta || typeof r.meta.regularMarketPrice !== 'number') throw new Error('bad payload');
      var meta = r.meta;
      return { price: meta.regularMarketPrice, prev: (meta.chartPreviousClose != null ? meta.chartPreviousClose : meta.previousClose) || null };
    }).catch(function () { return attempt(); });
  }
  return attempt();
}
function refreshPrices() {
  if (priceState.trying) return Promise.resolve(false);
  priceState.trying = true;
  setPriceBusy(true);
  return Promise.all([fetchYahooPrice('GC=F'), fetchYahooPrice('^DJI')])
    .then(function (rs) {
      var ax = rs[0], ad = rs[1], ok = false;
      if (ax && ms.xau) {
        ms.xau.price = ax.price;
        if (ax.prev) { ms.xau.prevClose = ax.prev; ms.xau.changePct = (ax.price - ax.prev) / ax.prev * 100; }
        ok = true;
      }
      if (ad && ms.dji) {
        ms.dji.price = ad.price;
        if (ad.prev) { ms.dji.prevClose = ad.prev; ms.dji.changePct = (ad.price - ad.prev) / ad.prev * 100; }
        ok = true;
      }
      priceState.lastTry = new Date();
      priceState.trying = false;
      setPriceBusy(false);
      if (ok) {
        priceState.mode = 'live';
        priceState.okAt = new Date();
        updatePriceWidgets(true);
        updateStatusUI();
        if (S.app && S.app.id === 'structure' && S.appPhase === 'open') renderApp('structure', true);
      } else {
        priceState.mode = 'offline';
        updateStatusUI();
      }
      return ok;
    })
    .catch(function () { priceState.trying = false; setPriceBusy(false); priceState.mode = 'offline'; updateStatusUI(); return false; });
}
function restoreSnapshot() {
  try {
    var snap = JSON.parse(SNAP_RAW);
    news = snap.news; ms = snap.market;
    priceState.mode = 'snapshot';
    updatePriceWidgets(true);
    updateStatusUI();
    if (S.app && S.appPhase === 'open') renderApp(S.app.id, true);
  } catch (e) {}
}
var _autoPriceTimer = null;
function applyAutoPrice() {
  if (_autoPriceTimer) { clearInterval(_autoPriceTimer); _autoPriceTimer = null; }
  if (settings.autoPrice) {
    _autoPriceTimer = setInterval(function () {
      if (document.visibilityState === 'visible') refreshPrices();
    }, 15 * 60 * 1000);
  }
}
function setPriceBusy(busy) {
  var b1 = document.getElementById('cc-refresh-prices');
  if (b1) b1.disabled = busy;
  var spins = document.querySelectorAll('[data-price-spin]');
  for (var i = 0; i < spins.length; i++) spins[i].classList.toggle('spin', busy);
  updateStatusUI();
}
function priceModeLabel() {
  if (priceState.mode === 'live') return 'قیمت زنده';

}

/* خواندن ردیف یک تایم‌فریم از داده ساختار */
function row(symKey, tf) {
  var sym = ms[symKey];
  if (!sym || !sym.rows) return null;
  for (var i = 0; i < sym.rows.length; i++) if (sym.rows[i].tf === tf) return sym.rows[i];
  return null;
}

/* ---------- اجزای پایه ---------- */
function iconVisHTML(id, size) {
  var a = APPS[id];
  var px = size || 52;
  var isz = px >= 50 ? 24 : 20;
  return '<span class="icon-vis ' + a.cls + (px < 50 ? ' sm' : '') + '" style="width:' + px + 'px;height:' + px + 'px;border-radius:' + Math.round(px * 0.29) + 'px">' + icon(a.ic, isz) + '</span>';
}
function trendDotHTML(row) {
  var t = row && row.trend ? row.trend : null;
  var cls = t ? trendChipCls(t) : 'na';
  var ic = t ? trendIcon(t) : 'minus';
  return '<span class="tdot ' + cls + '">' + icon(ic, 10) + (t ? trendText(t) : '—') + '</span>';
}
function chgCls(ch) { return ch == null ? 'chg-none' : ch > 0 ? 'chg-up' : ch < 0 ? 'chg-down' : 'chg-flat'; }
function chgText(sym) {
  var ch = sym && sym.changePct;
  if (ch == null) return 'در انتظار داده';
  return (ch > 0 ? '+' : '') + faDigits(ch.toFixed(2)) + '٪ امروز';
}

/* ---------- بنر تغییر جهت ---------- */
function changesSignature(changes) {
  return (changes || []).map(function (c) { return c.symbol + ':' + c.tf + ':' + c.from + '>' + c.to + ':' + c.atISO; }).join('|');
}
function changeRowHTML(c) {
  return '<div class="crow">' +
    '<span class="crow-sym">' + SYMBOL_LABEL[c.symbol] + '</span>' +
    '<span class="crow-tf">' + TF_LONG[c.tf] + '</span>' +
    '<span class="chip ' + trendChipCls(c.from) + '">' + trendText(c.from) + '</span>' +
    '<span class="crow-arrow" aria-hidden="true">←</span>' +
    '<span class="chip ' + trendChipCls(c.to) + '">' + trendText(c.to) + '</span>' +
    '<span class="crow-time">ساعت ' + faTime(new Date(c.atISO)) + '</span>' +

function bannerHTML() {
  var changes = ms && ms.changes ? ms.changes : [];

  if (lsGet(DISMISS_KEY) === sig) return '';
  var shown = changes.slice(0, 3);
  var extra = changes.length - shown.length;
  return '<div class="banner blink" role="alert" data-banner>' +
    '<div class="bnr-head">' +
    '<span class="bnr-ic soft-pulse">' + icon('bell', 16) + '</span>' +
    '<div style="min-width:0;flex:1">' +

    '<p class="bnr-t2">جهت روند ساختار در ' + faDigits(changes.length) + ' مورد تغییر کرد — ' + (changes.length > 1 ? 'موارد زیر جدیدترین‌اند' : 'جزئیات زیر') + '.</p>' +
    '</div>' +
    '<button type="button" class="bnr-x" data-banner-close aria-label="بستن اعلان تغییر جهت">' + icon('x', 14) + '</button>' +
    '</div>' +
    '<div class="bnr-rows">' + shown.map(changeRowHTML).join('') +
    (extra > 0 ? '<p class="bnr-extra">+ ' + faDigits(extra) + ' تغییر دیگر در ۶ ساعت گذشته</p>' : '') +

function priceWidgetHTML(key, title) {
  var sym = ms[key];

function cdFormat(msLeft) {
  var totalMin = Math.max(0, Math.floor(msLeft / 60000));
  var h = Math.floor(totalMin / 60), m = totalMin % 60;
  if (h === 0) return faDigits(m) + ' دقیقه';
  if (m === 0) return faDigits(h) + ' ساعت';
  return faDigits(h) + ':' + faDigits(String(m).padStart(2, '0'));
}
function nextHighEvent() {
  var now = Date.now(), best = null;
  var evs = news.events || [];
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    if (!e.dateISO) continue;
    var t = new Date(e.dateISO).getTime();
    if (t <= now) continue;
    if (e.impact !== 'High') continue;
    if (!best || t < new Date(best.dateISO).getTime()) best = e;
  }
  return best;
}
function countdownWidgetHTML() {
  var nx = nextHighEvent();
  var left = nx ? new Date(nx.dateISO).getTime() - Date.now() : null;
  return '<div class="widget" style="min-height:86px;justify-content:space-between">' +
    '<div class="w-row"><span class="w-title">تا خبر مهم</span>' + icon('flame', 14) + '</div>' +
    '<span class="w-big" data-cd-val>' + (left != null ? cdFormat(left) : '—') + '</span>' +
    '<span class="w-sub" data-cd-sub title="' + (nx ? (nx.titleFa || nx.title) : '') + '">' + (nx ? (nx.titleFa || nx.title) : 'خبر مهمی در صف نیست') + '</span>' +

function todayCounts() {

  return faDateLong(d);

function newsGroups() {
  var tKey = todayKeyInTehran();
  var map = {}, order = [];
  var evs = news.events || [];
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    var f = S_NEWS.filter;
    var ok = f === 'all' || (f === 'High' ? e.impact === 'High' : f === 'Medium' ? e.impact === 'Medium' : (e.impact === 'Low' || e.impact === 'Holiday'));
    if (!ok) continue;
    var k = e.dateISO ? dateKeyInTehran(new Date(e.dateISO)) : tKey;
    if (!map[k]) { map[k] = []; order.push(k); }
    map[k].push(e);
  }
  order.sort();
  if (S_NEWS.tab === 'today') order = order.filter(function (k) { return k === tKey; });
  else if (S_NEWS.tab === 'tomorrow') order = order.filter(function (k) { return k === addDaysToKey(tKey, 1); });
  else if (S_NEWS.tab === 'week') {
    var a = addDaysToKey(tKey, -6), b = addDaysToKey(tKey, 6);
    order = order.filter(function (k) { return k >= a && k <= b; });
  }
  order.forEach(function (k) {
    map[k].sort(function (x, y) {
      return (x.dateISO ? new Date(x.dateISO).getTime() : -1) - (y.dateISO ? new Date(y.dateISO).getTime() : -1);
    });
  });
  return order.map(function (k) { return [k, map[k]]; });
}

function renderApp(id, keep) {
  if (appTitle) appTitle.textContent = APPS[id] ? APPS[id].label : 'رصدگر دلار';
  if (id === 'news') renderNewsApp();
  else if (id === 'structure') renderStructureApp();
  else if (id === 'suggestion') renderSuggestionApp();
  else if (id === 'chart') renderChartApp();
  else renderAboutApp();
  appScroll.scrollTop = 0;
}

/* ---------- رویدادهای مشترک ---------- */
page1.addEventListener('pointerdown', function (e) {
  var btn = e.target.closest('[data-icon]');
  if (!btn) return;
  page1IconPointerDown(btn.dataset.icon, e);
});
page1.addEventListener('pointermove', function (e) {
  if (!S.wiggle && !S.press) return;
  var id = S.drag ? S.drag.id : (S.press ? S.press.id : null);
  if (!id) return;
  page1IconPointerMove(id, e);
});
page1.addEventListener('pointerup', function (e) {
  if (S.drag) page1IconPointerUp(S.drag.id);
  else if (S.press) page1IconPointerUp(S.press.id);
});
page1.addEventListener('pointercancel', function () {
  if (S.drag) page1IconPointerUp(S.drag.id);
  cancelLongPress();
});
page1.addEventListener('click', function (e) {
  var btn = e.target.closest('[data-icon]');
  if (btn) { page1IconClick(btn.dataset.icon); return; }
  var bc = e.target.closest('[data-banner-close]');
  if (bc) {
    var changes = ms && ms.changes ? ms.changes : [];
    lsSet(DISMISS_KEY, changesSignature(changes));
    var b = page1.querySelector('[data-banner]');
    if (b) b.remove();
  }
});
dockIn.addEventListener('click', function (e) {
  var b = e.target.closest('[data-app]');
  if (b) { openApp(b.dataset.app, b); return; }
  var a = e.target.closest('[data-act]');
  if (a) { if (a.dataset.act === 'nc') openNC(); else if (a.dataset.act === 'cc') openCC(); }
});

/* ---------- تنظیم انیمیشن‌ها ---------- */
function applyAnim() { device.classList.toggle('no-anim', !settings.anim); }

/* ---------- راه‌اندازی ---------- */
function homeTick() {
  updateCountdown();
  updateTodayCount();
}
function boot() {
  try { if (history.state && history.state.sd) history.replaceState(null, ''); } catch (e) {}
  renderStatusRight();
  tickClock();
  setInterval(tickClock, 1000);
  renderPage1();
  renderPage2();
  renderDock();
  renderDots();
  onPageScroll();
  applyAnim();
  _lastCdId = (nextHighEvent() || {}).id || 'none';
  _lastTcKey = (function () { var c = todayCounts(); return c.count + ':' + c.high; })();
  setInterval(homeTick, 30000);
  applyAutoPrice();
  if (!lsGet(HINT_KEY)) {
    var hint = $('#hint');
    hint.hidden = false;
    lsSet(HINT_KEY, '1');
    setTimeout(function () { hint.hidden = true; }, 9200);
  }
  window.addEventListener('resize', onPageScroll);
}
boot();

})();</script>

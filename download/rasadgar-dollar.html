    '<div class="st-row"><span style="color:var(--mutedfg)">' + icon('calDays', 12) + '</span><span class="st-k">تولید فایل:</span><span class="st-v">' + faDateLong(gen) + ' — ' + faTime(gen) + '</span></div>' +

}

/* ---------- مرکز کنترل ---------- */
function swHTML(key, icname, accent, label) {
  return '<button type="button" class="cc-tile" data-toggle="' + key + '" role="switch" aria-checked="' + !!settings[key] + '" aria-label="' + label + '">' +
    '<span class="cc-ic ' + accent + '">' + icon(icname, 16) + '</span>' +
    '<span class="cc-label">' + label + '</span>' +
    '<span class="sw' + (settings[key] ? ' on' : '') + '" data-sw></span>' +
    '</button>';
}
function actionHTML(id, icname, accent, label, busyAttr) {
  return '<button type="button" class="cc-tile" data-action="' + id + '"' + (busyAttr ? ' id="' + busyAttr + '"' : '') + '>' +
    '<span class="cc-ic ' + accent + '"><span data-price-spin' + (id === 'refresh-prices' ? '' : ' style="display:contents"') + '>' + icon(icname, 16) + '</span></span>' +
    '<span class="cc-label">' + label + '</span>' +
    '</button>';
}
function renderCC() {
  var pm = priceState.mode;
  var chips =
    '<span class="stat-chip">قیمت‌ها: ' + priceModeLabel() + '</span>' +
    '<span class="stat-chip">' + (priceState.lastTry ? 'آخرین تلاش: ' + faTime(priceState.lastTry) : 'بدون تلاش اخیر') + '</span>' +
    '<span class="stat-chip">اخبار: اسنپ‌شات فایل</span>';
  ccSheet.innerHTML =
    '<div class="grabber"></div>' +
    '<div class="cc-head"><h3 class="cc-title">مرکز کنترل</h3><div style="display:flex;align-items:center;gap:8px;color:var(--mutedfg)">' + icon('signal', 14) + icon('wifi', 14) + icon('battery', 18) + '</div></div>' +
    '<div class="stat-chips">' + chips + '</div>' +
    '<div class="cc-grid">' +
    swHTML('highOnly', 'flame', 'cc-a-amber', 'تمرکز روی اخبار خیلی مهم') +
    swHTML('autoPrice', 'refresh', 'cc-a-sky', 'تلاش خودکار قیمت‌ها (هر ۱۵ دقیقه)') +
    swHTML('anim', 'sparkles', 'cc-a-violet', 'انیمیشن‌ها و پالس ویجت‌ها') +
    actionHTML('refresh-prices', 'refresh', 'cc-a-emerald', 'بروزرسانی زنده قیمت‌ها (نیازمند اینترنت)', 'cc-refresh-prices') +
    actionHTML('restore', 'db', 'cc-a-rose', 'بازنشانی به داده داخل فایل', '') +
    '<div class="cc-tile" style="cursor:default">' +
    '<span class="cc-ic cc-a-muted">' + icon('db', 16) + '</span>' +
    '<span style="min-width:0;flex:1"><span style="display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700">منابع داده</span>' +
    '<span class="cc-src">اخبار: ForexFactory — قیمت: Yahoo Finance — ترجمه و تحلیل: هوش مصنوعی (در لحظه تولید فایل)</span></span>' +
    '</div>' +
    '</div>' +
    '<p class="cc-note">برای بستن، به پایین بکشید یا پس‌زمینه را لمس کنید</p>';
  var tiles = ccSheet.querySelectorAll('[data-toggle]');
  for (var i = 0; i < tiles.length; i++) {
    (function (t) {
      t.addEventListener('click', function () {
        var k = t.dataset.toggle;
        settings[k] = !settings[k];
        saveSettings();
        t.setAttribute('aria-checked', !!settings[k]);
        var sw = t.querySelector('[data-sw]');
        if (sw) sw.classList.toggle('on', settings[k]);
        if (k === 'autoPrice') applyAutoPrice();
        if (k === 'anim') applyAnim();
        if (k === 'highOnly' && S.app && S.app.id === 'news' && S.appPhase === 'open') renderApp('news', true);
        buzz();
      });
    })(tiles[i]);
  }
  var acts = ccSheet.querySelectorAll('[data-action]');
  for (var j = 0; j < acts.length; j++) {
    (function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.action === 'refresh-prices') refreshPrices();
        else if (b.dataset.action === 'restore') { restoreSnapshot(); renderCC(); }
      });
    })(acts[j]);
  }
}

function newsGroups() {
  var tKey = todayKeyInTehran();
  var map = {}, order = [];
  var evs = news.events || [];
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    var f = S_NEWS.filter;
    var ok = f === 'all' || (f === 'High' ? e.impact === 'High' : f === 'Medium' ? e.impact === 'Medium' : (e.impact === 'Low' || e.impact === 'Holiday'));
    if (!ok) continue;
    var k = e.dateISO ? dateKeyInTehran(new Date(e.dateISO)) : tKey;
    if (!map[k]) { map[k] = []; order.push(k); }
    map[k].push(e);
  }
  order.sort();
  if (S_NEWS.tab === 'today') order = order.filter(function (k) { return k === tKey; });
  else if (S_NEWS.tab === 'tomorrow') order = order.filter(function (k) { return k === addDaysToKey(tKey, 1); });
  else if (S_NEWS.tab === 'week') {
    var a = addDaysToKey(tKey, -6), b = addDaysToKey(tKey, 6);
    order = order.filter(function (k) { return k >= a && k <= b; });
  }
  order.forEach(function (k) {
    map[k].sort(function (x, y) {
      return (x.dateISO ? new Date(x.dateISO).getTime() : -1) - (y.dateISO ? new Date(y.dateISO).getTime() : -1);
    });
  });
  return order.map(function (k) { return [k, map[k]]; });
}

      (S_NEWS.tab === 'today' ? '<button type="button" class="btn" data-goweek>' + icon('calDays', 14) + 'مشاهده این هفته</button>' : '') +

var SUG = { st: '1h', en: '5m' };
/* تایم‌فریم‌های ساختار قابل انتخاب توسط کاربر — ۵ دقیقه هم اضافه شد (داده در اسنپ‌شات موجود است) */
var SUG_ST_TFS = ['5m', '15m', '1h', '4h', '1d', '1wk', '1mo'];
function sugStOptions() {
  return SUG_ST_TFS.map(function (tf) { return '<option value="' + tf + '"' + (SUG.st === tf ? ' selected' : '') + '>' + TF_LONG[tf] + '</option>'; }).join('');
}
function validEntries(st) {
  return ['5m', '15m', '1h', '4h'].filter(function (tf) { return TF_MINUTES[tf] <= TF_MINUTES[st]; });
}
function effectiveEntry() {
  var v = validEntries(SUG.st);

}
function msRow(symKey, tf) { return row(symKey, tf); }

  if (!stT || !enT) return { key: 'wait', reason: 'داده یکی از دو تایم‌فریم ناکافی است' };
  if (stT === 'bullish' && enT === 'bullish') return { key: 'buy', reason: 'ساختار و ورود هر دو صعودی‌اند' };
  if (stT === 'bearish' && enT === 'bearish') return { key: 'sell', reason: 'ساختار و ورود هر دو نزولی‌اند' };
  if (stT === 'neutral' || enT === 'neutral') return { key: 'wait', reason: 'یکی از دو تایم‌فریم خنثی است' };

function sugChipHTML(label, t) {

    '<div><span class="sel-k">تایم‌فریم ورود</span><select class="sel" data-sug-en aria-label="تایم‌فریم ورود">' + enOpts + '</select></div>' +

 * موتور محاسباتی محلی: امتیاز اطمینان (کانفلونس)، پلن معامله، واگرایی DXY،
 * رژیم بازار، سناریوهای خبری، پیش‌مرگ و ژورنال رفتاری.
 * منبع داده: ساختار بازار و اخبار از اسنپ‌شات فایل + سری روزانه Yahoo از طریق پروکسی.
 * ================================================================================ */

/* ---------- موتور محاسباتی (نسخه JS از trader-engine) ---------- */
function trReturns(c) {
  var out = [], i;
  for (i = 1; i < c.length; i++) if (c[i - 1] !== 0) out.push((c[i] - c[i - 1]) / c[i - 1]);
  return out;
}
function trPearson(a, b) {
  var n = Math.min(a.length, b.length);
  if (n < 20) return null;
  var sa = 0, sb = 0, i;
  for (i = 0; i < n; i++) { sa += a[i]; sb += b[i]; }
  var ma = sa / n, mb = sb / n, num = 0, da = 0, db = 0;
  for (i = 0; i < n; i++) {
    var x = a[i] - ma, y = b[i] - mb;
    num += x * y; da += x * x; db += y * y;
  }
  if (da === 0 || db === 0) return null;
  return num / Math.sqrt(da * db);
}
function trAtrPct(h, l, c) {
  var n = c.length;
  if (n < 15) return null;
  var trs = [], i;
  for (i = 1; i < n; i++) trs.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
  var a = 0;
  for (i = trs.length - 14; i < trs.length; i++) a += trs[i];
  return (a / 14) / c[n - 1] * 100;
}
function trER(c, win) {
  if (c.length < win + 1) return null;
  var s = c.slice(-(win + 1)), net = Math.abs(s[s.length - 1] - s[0]), path = 0, i;
  for (i = 1; i < s.length; i++) path += Math.abs(s[i] - s[i - 1]);
  return path === 0 ? null : net / path;
}
function trTfFactor(dirs) {
  var valid = [], i;
  for (i = 0; i < dirs.length; i++) if (dirs[i] !== 'neutral') valid.push(dirs[i]);

  for (i = 0; i < n; i++) macd.push(e12[i] !== null && e26[i] !== null ? e12[i] - e26[i] : 0);
  var sig = emaSeries(macd, 9);
  return macd[n - 1] - sig[n - 1];
}

function thDmiLast(h, l, c, p) {
  var n = c.length, i;
  if (n < 2 * p + 2) return { pdi: null, mdi: null, adx: null };
  var trs = [], pdms = [], mdms = [];
  for (i = 1; i < n; i++) {
    var up = h[i] - h[i - 1], dn = l[i - 1] - l[i];
    pdms.push(up > dn && up > 0 ? up : 0);
    mdms.push(dn > up && dn > 0 ? dn : 0);
    trs.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
  }
  var trS = 0, pS = 0, mS = 0, k;
  for (i = 0; i < p; i++) { trS += trs[i]; pS += pdms[i]; mS += mdms[i]; }
  var dxs = [], pdi = null, mdi = null;
  for (i = p; i < trs.length; i++) {
    trS = trS - trS / p + trs[i];
    pS = pS - pS / p + pdms[i];
    mS = mS - mS / p + mdms[i];
    var pd = trS > 0 ? (pS / trS) * 100 : 0;
    var md = trS > 0 ? (mS / trS) * 100 : 0;
    pdi = pd; mdi = md;
    dxs.push(pd + md > 0 ? (Math.abs(pd - md) / (pd + md)) * 100 : 0);
  }
  if (dxs.length < p) return { pdi: pdi, mdi: mdi, adx: null };
  var adx = 0;
  for (k = dxs.length - p; k < dxs.length; k++) adx += dxs[k];
  return { pdi: pdi, mdi: mdi, adx: adx / p };
}

function thAroonLast(h, l, p) {
  var n = h.length, i;
  if (n < p + 1) return { up: null, down: null };
  var hi = -Infinity, lo = Infinity, hiIdx = 0, loIdx = 0;
  for (i = n - p; i < n; i++) {
    if (h[i] >= hi) { hi = h[i]; hiIdx = i; }
    if (l[i] <= lo) { lo = l[i]; loIdx = i; }
  }
  return { up: ((p - (n - 1 - hiIdx)) / p) * 100, down: ((p - (n - 1 - loIdx)) / p) * 100 };
}

function thUoLast(h, l, c) {
  var n = c.length, i;
  if (n < 29) return null;
  var bp = [], tr = [];
  for (i = 1; i < n; i++) {
    var tl = Math.min(l[i], c[i - 1]);
    bp.push(c[i] - tl);
    tr.push(Math.max(h[i], c[i - 1]) - tl);
  }
  function avg(len) {
    var b = 0, t = 0, j;
    for (j = bp.length - len; j < bp.length; j++) { b += bp[j]; t += tr[j]; }
    return t > 0 ? b / t : 0;
  }
  return ((4 * avg(7) + 2 * avg(14) + avg(28)) / 7) * 100;
}

function thTsiLast(c) {
  var n = c.length, i;
  if (n < 40) return null;
  var pc = [];
  for (i = 1; i < n; i++) pc.push(c[i] - c[i - 1]);
  function emaSeries(src, p) {
    var out = [], k = 2 / (p + 1), prev = null, j, s;
    for (j = 0; j < src.length; j++) {
      if (j === p - 1) { s = 0; for (var q = 0; q < p; q++) s += src[q]; prev = s / p; out.push(prev); }
      else if (prev !== null) { prev = src[j] * k + prev * (1 - k); out.push(prev); }
      else out.push(null);
    }
    return out;
  }
  var e1 = emaSeries(pc, 25), absPc = pc.map(Math.abs);
  var ea1 = emaSeries(absPc, 25);
  var d1 = e1.map(function (v) { return v === null ? 0 : v; });
  var da1 = ea1.map(function (v) { return v === null ? 0 : v; });
  var e2 = emaSeries(d1, 13), ea2 = emaSeries(da1, 13);
  var num = e2[e2.length - 1], den = ea2[ea2.length - 1];
  if (num === null || den === null || den === 0) return null;
  return (num / den) * 100;
}

function thEmaLast(src, p) {
  var n = src.length, i;
  if (n < p) return null;
  var s = 0;
  for (i = 0; i < p; i++) s += src[i];
  var prev = s / p, k = 2 / (p + 1);
  for (i = p; i < n; i++) prev = src[i] * k + prev * (1 - k);
  return prev;
}

/* محاسبه اصلی دماسنج — ser = {t,h,l,c,v|null} */
function thCompute(ser) {
  var h = ser.h, l = ser.l, c = ser.c, n = c.length, i;
  var hasVol = !!(ser.v && ser.v.length === n && ser.v.some(function (x) { return x != null && x > 0; }));
  var atr = thAtrLast(h, l, c);
  var atrPct = (atr / c[n - 1]) * 100;
  var ind = [];
  function add(id, nameFa, raw, needsVol) {
    if (raw === null || raw === undefined || !isFinite(raw)) return;
    var s = thClamp(raw);
    ind.push({ id: id, nameFa: nameFa, score: Math.round(s * 1000) / 1000, dir: s > 0.15 ? 'buy' : s < -0.15 ? 'sell' : 'neutral', needsVolume: !!needsVol });
  }

  var rsi = thRsiLast(c);
  add('rsi', 'RSI', rsi === null ? null : (rsi - 50) / 50);
  var st = thStochLast(h, l, c, 14, 3);
  add('stoch', 'استوکاستیک', st === null ? null : (st - 50) / 50);
  var sr = thStochRsiLast(c);
  add('stochrsi', 'استوکاستیک RSI', sr === null ? null : (sr - 50) / 50);
  var cci = thCciLast(h, l, c);
  add('cci', 'CCI', cci === null ? null : cci / 150);
  var wr = thWillrLast(h, l, c);
  add('willr', 'ویلیامز %R', wr === null ? null : (wr + 50) / 50);
  if (hasVol) add('mfi', 'MFI جریان پول', (function () { var m = thMfiLast(h, l, c, ser.v); return m === null ? null : (m - 50) / 50; })(), true);
  var mh = thMacdHistLast(c);
  add('macd', 'MACD', mh === null ? null : mh / (0.35 * atr));
  if (hasVol && n >= 25) {
    var obv = 0, obvs = [], vsum = 0;
    for (i = 1; i < n; i++) {
      obv += c[i] > c[i - 1] ? ser.v[i] : c[i] < c[i - 1] ? -ser.v[i] : 0;
      obvs.push(obv);
    }
    for (i = n - 20; i < n; i++) vsum += ser.v[i];
    var d = obvs[obvs.length - 1] - obvs[obvs.length - 1 - 20];
    add('obv', 'OBV حجم تعادلی', vsum > 0 ? thClamp(d / vsum * 1.2) : null, true);
  }
  var dmi = thDmiLast(h, l, c, 14);
  if (dmi.pdi !== null && dmi.mdi !== null && dmi.adx !== null && dmi.pdi + dmi.mdi > 0) {
    var dirW = (dmi.pdi - dmi.mdi) / (dmi.pdi + dmi.mdi);
    var strength = Math.max(0.3, Math.min(1, dmi.adx / 25));
    add('dmi', 'DMI / ADX', dirW * strength);
  }
  if (n >= 11 && atrPct > 0) {
    var roc = (c[n - 1] - c[n - 11]) / c[n - 11] * 100;
    add('roc', 'ROC سرعت قیمت', roc / (3 * atrPct));
  }
  if (n >= 15) {
    var g = 0, lo = 0;
    for (i = n - 14; i < n; i++) { var dd = c[i] - c[i - 1]; if (dd > 0) g += dd; else lo -= dd; }
    var cmo = g + lo > 0 ? ((g - lo) / (g + lo)) * 100 : 0;
    add('cmo', 'CMO مومنتوم', cmo / 100);
  }
  var uo = thUoLast(h, l, c);
  add('uo', 'اسیلاتور فراگیر', uo === null ? null : (uo - 50) / 50);
  if (n >= 34) {
    var med = [], j;
    for (j = 0; j < n; j++) med.push((h[j] + l[j]) / 2);
    var s5 = thEmaLast(med, 5) === null ? null : (function () { var s = 0, k; for (k = n - 5; k < n; k++) s += med[k]; return s / 5; })();
    var s34 = (function () { var s = 0, k; for (k = n - 34; k < n; k++) s += med[k]; return s / 34; })();
    add('ao', 'اسیلاتور شگفت‌انگیز', (s5 - s34) / (0.5 * atr));
  }
  var tsi = thTsiLast(c);
  add('tsi', 'TSI واقعی', tsi === null ? null : tsi / 40);
  if (n >= 20) {
    var win = c.slice(-20), m = 0, k2;
    for (k2 = 0; k2 < 20; k2++) m += win[k2];
    m /= 20;
    var sd = 0;
    for (k2 = 0; k2 < 20; k2++) sd += (win[k2] - m) * (win[k2] - m);
    sd = Math.sqrt(sd / 20);
    var pb = sd > 0 ? ((c[n - 1] - (m - 2 * sd)) / (4 * sd)) * 100 : 50;
    add('bb', 'بولینگر %B', (pb - 50) / 50);
  }
  var e20 = thEmaLast(c, 20), e50 = thEmaLast(c, 50);
  if (e20 !== null && e50 !== null) add('ema', 'میانگین‌های متحرک', ((e20 - e50) + (c[n - 1] - e50)) / 2 / (0.5 * atr));
  var ar = thAroonLast(h, l, 25);
  if (ar.up !== null && ar.down !== null) add('aroon', 'آرون', (ar.up - ar.down) / 100);
  var e13 = thEmaLast(c, 13);
  if (e13 !== null) add('elder', 'قدرت گاو/خرس', ((h[n - 1] - e13) + (l[n - 1] - e13)) / 2 / (0.5 * atr));

  var buy = 0, sell = 0;
  var sum = 0;
  for (i = 0; i < ind.length; i++) { sum += ind[i].score; if (ind[i].dir === 'buy') buy++; else if (ind[i].dir === 'sell') sell++; }
  var neutral = ind.length - buy - sell;
  var mean = ind.length ? sum / ind.length : 0;
  var score = Math.round(thClamp((mean + 1) / 2, 0, 1) * 100);
  var zone = score >= 80 ? 'heavy-buy' : score >= 60 ? 'buy' : score > 40 ? 'neutral' : score > 20 ? 'sell' : 'heavy-sell';
  var zoneFa = zone === 'heavy-buy' ? 'فشار خرید سنگین' : zone === 'buy' ? 'فشار خرید' : zone === 'neutral' ? 'خنثی / متعادل' : zone === 'sell' ? 'فشار فروش' : 'فشار فروش سنگین';
  var dir = score >= 60 ? 'buy' : score <= 40 ? 'sell' : 'neutral';
  var guidanceFa =
    zone === 'heavy-buy' ? 'بازار کاملاً در دست خریداران است — تعقیب قیمت در این ناحیه ریسک اصلاح تند دارد؛ منتظر پولبک بمانید.' :
    zone === 'buy' ? 'مومنتوم خرید غالب است — مسیر کوتاه‌مدت به سمت بالا متمایل است؛ پولبک‌ها به حمایت جای پایش ورود هستند.' :
    zone === 'neutral' ? 'فشار خرید و فروش تقریباً برابر است — جهت روشن نیست؛ معامله در میانه این ناحیه کم‌بازده و پرریسک است.' :
    zone === 'sell' ? 'مومنتوم فروش غالب است — مسیر کوتاه‌مدت به سمت پایین متمایل است؛ برگشت‌ها به مقاومت جای پایش فروش هستند.' :
    'بازار کاملاً در دست فروشندگان است — خرید ضدروند در این ناحیه پرریسک است؛ منتظر تثبیت بمانید.';
  var sentenceFa = ind.length === 0 ? 'هیچ اندیکاتوری قابل محاسبه نبود.' :
    'از ' + ind.length + ' اندیکاتور فعال: ' + buy + ' اندیکاتور فشار خرید، ' + sell + ' اندیکاتور فشار فروش و ' + neutral + ' اندیکاتور خنثی';
  return {
    score: score, zone: zone, zoneFa: zoneFa, dir: dir,
    consensus: { total: ind.length, buy: buy, sell: sell, neutral: neutral, sentenceFa: sentenceFa },
    indicators: ind, guidanceFa: guidanceFa, usedVolume: hasVol, bars: n,
    reliable: ind.length >= 8,
    disclaimer: 'دماسنج فشار، احتمال‌سنج مومنتوم لحظه بازار است — نه پیش‌بینی قطعی و نه توصیه خرید/فروش.'
  };
}

/* مرز کندل ۴ساعته بروکری (۱۷:۰۰ نیویورک) — مثل موتور اسکلپ */
function thH4Phase() {
  var ms = Date.now();
  var y = new Date(ms).getUTCFullYear();
  function dow(u) { return new Date(u).getUTCDay(); }
  var mar1 = Date.UTC(y, 2, 1), nov1 = Date.UTC(y, 10, 1);
  var dstStart = mar1 + ((7 - dow(mar1)) % 7) * 86400000 + 7 * 86400000;
  var dstEnd = nov1 + ((7 - dow(nov1)) % 7) * 86400000;
  return ms >= dstStart && ms < dstEnd ? 3600 : 7200;
}

/* تجمیع ۴ساعته سری {t,h,l,c,v} با فاز */
function thAggregate4h(ser, phase) {
  var BUCKET = 4 * 3600, map = {}, keys = [], i;
  for (i = 0; i < ser.t.length; i++) {
    var k = Math.floor((ser.t[i] - phase) / BUCKET) * BUCKET + phase;
    if (map[k] === undefined) { map[k] = { t: k, o: ser.c[i], h: ser.h[i], l: ser.l[i], c: ser.c[i], v: ser.v ? ser.v[i] : null }; keys.push(k); }
    else {
      if (ser.h[i] > map[k].h) map[k].h = ser.h[i];
      if (ser.l[i] < map[k].l) map[k].l = ser.l[i];
      map[k].c = ser.c[i];
    }
  }
  keys.sort(function (a, b) { return a - b; });
  var out = { t: [], h: [], l: [], c: [], v: [] };
  for (i = 0; i < keys.length; i++) {
    out.t.push(map[keys[i]].t); out.h.push(map[keys[i]].h); out.l.push(map[keys[i]].l); out.c.push(map[keys[i]].c); out.v.push(map[keys[i]].v);
  }
  return out;
}

/* ---------- رنج فشرده ---------- */
function trRangeComp(h, l, c) {
  var n = c.length, i;
  if (n < 60) return { active: false, severity: 'normal', message: '', advice: [], metrics: { atrPctile: null, er: null, boxPctOfAtr: null } };
  var trs = [];
  for (i = 1; i < n; i++) trs.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
  var atrSeries = [], period = 14;
  for (i = period; i < trs.length; i++) { var s = 0, j; for (j = i - period + 1; j <= i; j++) s += trs[j]; atrSeries.push(s / period); }
  if (atrSeries.length < 60) return { active: false, severity: 'normal', message: '', advice: [], metrics: { atrPctile: null, er: trER(c), boxPctOfAtr: null } };
  var atrNow = atrSeries[atrSeries.length - 1], below = 0;
  for (i = 0; i < atrSeries.length; i++) if (atrSeries[i] <= atrNow) below++;
  var atrPctile = Math.round(below / atrSeries.length * 100);
  var er = trER(c);
  var hh = -Infinity, ll = Infinity;
  for (i = Math.max(0, n - 20); i < n; i++) { if (h[i] > hh) hh = h[i]; if (l[i] < ll) ll = l[i]; }
  var boxPctOfAtr = atrNow > 0 ? Math.round((hh - ll) / atrNow * 10) / 10 : null;
  var advice = [
    'تا شکست معتبر صبر کنید: بسته‌شدن کندل خارج از محدوده + پولبک موفق، نه یک کندل شانه‌ای.',
    'شکست‌های کاذب در رنج فشرده شایع‌اند — ورود زودهنگام روی شکست، بالاترین ریسک را دارد.',
    'حد ضرر خیلی نزدیک در این شرایط با کوچک‌ترین نوسان حذف می‌شود — فاصله استاپ را واقع‌بینانه بگیرید.',
    'معامله در میانه رنج نکنید — فقط واکنش به لبه‌ها با تأیید، یا پرهیز کامل تا روشن‌شدن جهت.'
  ];
  if (atrPctile <= 20 && (er === null || er <= 0.3)) {
    return { active: true, severity: 'tight', message: 'هشدار جدی: بازار در رنج فشرده قرار دارد — دامنه نوسان (ATR) در صدک ' + atrPctile + ' توزیع تاریخی خودش است و ارتفاع محدوده معاملاتی فقط ' + boxPctOfAtr + ' برابر ATR است. احتمال انفجار قیمتی ناگهانی یا اسپاسم‌های کاذب بالا می‌رود.', advice: advice, metrics: { atrPctile: atrPctile, er: er === null ? null : Math.round(er * 100) / 100, boxPctOfAtr: boxPctOfAtr } };
  }
  if (er !== null && er <= 0.15) {
    return { active: true, severity: 'normal', message: 'بازار در رنج است — نسبت کارایی ' + Math.round(er * 100) + '٪ و صدک ATR روی ' + atrPctile + ' است؛ سطوح افقی غالب‌اند و شکست‌ها اغلب برمی‌گردند.', advice: advice, metrics: { atrPctile: atrPctile, er: Math.round(er * 100) / 100, boxPctOfAtr: boxPctOfAtr } };
  }
  return { active: false, severity: 'normal', message: '', advice: [], metrics: { atrPctile: atrPctile, er: er === null ? null : Math.round(er * 100) / 100, boxPctOfAtr: boxPctOfAtr } };
}

/* ---------- نواحی ورود مبتنی بر ساختار ---------- */
function trZones(trend, price, sup, res, atrAbs, rw) {
  var trendFa = trend === 'bullish' ? 'صعودی' : trend === 'bearish' ? 'نزولی' : trend === 'neutral' ? 'خنثی' : 'نامشخص';
  var out = { trend: trend, trendFa: trendFa, zones: [], note: '', rangeWarning: rw && rw.active ? rw : null };
  var rp = function (v) { return Math.round(v * 100) / 100; };
  if (rw && rw.active && rw.severity === 'tight') {
    out.note = 'به دلیل رنج فشرده، ناحیه ورودی پیشنهاد نمی‌شود — ورود در این شرایط قمار است، نه تحلیل. منتظر شکست معتبر و تثبیت بمانید.';
    return out;
  }
  if (!price || !atrAbs || atrAbs <= 0) {
    out.note = 'داده کافی (قیمت یا ATR) برای پیشنهاد ناحیه ورود موجود نیست.';
    return out;
  }
  var pad = 0.25 * atrAbs, buf = 0.5 * atrAbs;
  var buyZone = function (lo, hi, basis) {
    var entry = (lo + hi) / 2, sl = lo - buf, risk = entry - sl;
    return { side: 'buy', zoneLo: rp(lo), zoneHi: rp(hi), sl: rp(sl), tp1: rp(entry + 2 * risk), tp2: rp(entry + 3 * risk), activeNow: price >= lo && price <= hi, basis: basis, invalidate: 'بسته‌شدن کندل زیر ' + rp(sl) + ' ساختار خرید را باطل می‌کند.' };
  };
  var sellZone = function (lo, hi, basis) {
    var entry = (lo + hi) / 2, sl = hi + buf, risk = sl - entry;
    return { side: 'sell', zoneLo: rp(lo), zoneHi: rp(hi), sl: rp(sl), tp1: rp(entry - 2 * risk), tp2: rp(entry - 3 * risk), activeNow: price >= lo && price <= hi, basis: basis, invalidate: 'بسته‌شدن کندل بالای ' + rp(sl) + ' ساختار فروش را باطل می‌کند.' };
  };
  if (trend === 'bullish' && sup && sup < price) {
    var hiB = Math.min(sup + pad, price);
    out.zones.push(buyZone(sup, Math.max(hiB, sup + 0.05 * atrAbs), 'پولبک به حمایت/کف سوئینگ در ساختار صعودی — خرید در محدوده سبک‌گیری، نه تعقیب قیمت'));
    out.note = 'ساختار صعودی است؛ ناحیه زیر «انتظار پولبک» است — اگر قیمت بدون اصلاح برود بالا، تعقیب نکنید.';
    return out;
  }
  if (trend === 'bearish' && res && res > price) {
    var loB = Math.max(res - pad, price);
    out.zones.push(sellZone(Math.min(loB, res - 0.05 * atrAbs), res, 'پولبک به مقاومت/سقف سوئینگ در ساختار نزولی — فروش در محدوده اصلاح، نه تعقیب سقوط'));
    out.note = 'ساختار نزولی است؛ ناحیه بالا «انتظار اصلاح» است — اگر قیمت بدون اصلاح سقوط کرد، فروش در کف نکنید.';
    return out;
  }
  if (rw && rw.active && rw.severity === 'normal' && sup && res && res > sup) {
    out.zones.push(buyZone(sup, sup + pad, 'لبه پایینی رنج پهن — فقط با تأیید کندل بازگشتی؛ هدف اول میانه رنج'));
    out.zones.push(sellZone(res - pad, res, 'لبه بالایی رنج پهن — فقط با تأیید کندل بازگشتی؛ هدف اول میانه رنج'));
    out.note = 'بازار رنج است؛ معامله فقط از لبه‌ها با تأیید، و هدف‌گیری میانه رنج — نه انتظار شکست.';
    return out;
  }
  out.note = 'ساختار فعلی جهت‌گیری روشن ندارد (خنثی/داده ناکافی) — ناحیه ورود قابل استخراج نیست و حدس زده نمی‌شود.';

    var lite = { ok: false, via: '', reportedAtFa: null, baseScenario: null, baseScenarioFa: null, longAbove: null, shortBelow: null, stopLoss: null, targets: [], tomorrow: { low: null, avg: null, high: null }, week: { low: null, avg: null, high: null }, rsi: null };
    if (rs[0].status === 'fulfilled') {
      try { var pl = anParseLite(rs[0].value.text); pl.via = rs[0].value.via; lite = pl; } catch (e) { lite.error = 'پارس ناموفق'; }
    }
    var fx = { ok: false, via: '', poll: [], items: [] };
    if (rs[1].status === 'fulfilled') {
      try { var pf = anParseFx(rs[1].value.text); pf.via = rs[1].value.via; fx = pf; } catch (e) { fx.error = 'پارس ناموفق'; }
    }
    var tv = { ok: false, stateFa: null };
    if (rs[2].status === 'fulfilled' && rs[2].value) tv = { ok: true, stateFa: tvRatingStateFa(rs[2].value.all) };
    /* fallback per-source: هر بخش قطع‌شده از اسنپ‌شات تاریخ‌دار داخلی پر می‌شود */
    if (!lite.ok && AN_SNAPSHOT && AN_SNAPSHOT.lite && AN_SNAPSHOT.lite.ok) {
      lite = JSON.parse(JSON.stringify(AN_SNAPSHOT.lite));
      lite.snapshot = true;
    }
    if (!fx.ok && AN_SNAPSHOT && AN_SNAPSHOT.fx && AN_SNAPSHOT.fx.ok) {
      fx = JSON.parse(JSON.stringify(AN_SNAPSHOT.fx));
      fx.snapshot = true;
    }
    var anything = lite.ok || fx.ok || tv.ok;
    if (!anything && AN_SNAPSHOT) {
      var snap = AN_SNAPSHOT;
      var brSnap = {
        ok: true, stale: true, ageMin: null, generatedAtISO: snap.generatedAtISO || new Date().toISOString(),
        lite: snap.lite, fx: snap.fx, tv: { ok: false, stateFa: null },
        summaryFa: anSynthesize(snap.lite, snap.fx, null),
        sourcesNoteFa: 'حالت اسنپ‌شات: دریافت زنده از منابع ناموفق بود و آخرین نسخه ذخیره‌شده هنگام ساخت ابزار نمایش داده می‌شود — تاریخ گزارش‌ها را ببینید.'
      };
      AN_BR_CACHE = { at: Date.now(), data: brSnap };
      AN.br = brSnap;
      AN.busy = false;
      renderAnalysisApp(true);
      if (AN.tab === 'path' && !AN.pathBusy) btPathCompute();
      return;
    }
    var br = {
      ok: anything, stale: false, ageMin: 0,
      generatedAtISO: new Date().toISOString(),
      lite: lite, fx: fx, tv: tv,
      summaryFa: anything ? anSynthesize(lite, fx, tv) : [],
      sourcesNoteFa: 'منابع: LiteFinance (پیش‌بینی روزانه/هفتگی طلا) · FXStreet (تحلیل‌ها و نظرسنجی) · تریدینگ‌ویو (رأی فنی روزانه). دریافت از مرورگر شما با کمک پروکسی عمومی/آرشیو انجام می‌شود؛ زمان هر بخش جداگانه ذکر شده است.'
    };
    if (anything) AN_BR_CACHE = { at: Date.now(), data: br };
    AN.br = br;
    AN.busy = false;
    renderAnalysisApp(true);
    /* اگر تب نقشه مسیر باز است و بریفینگ تازه رسیده، نقشه را با رأی TV/LiteFinance تازه ترسیم کن */
    if (AN.tab === 'path' && !AN.pathBusy) btPathCompute();
  });
}

/* ================= نقشهٔ مسیر امروز (تلفیق منابع) ================= */

var PM_DIR_FA = { buy: 'خرید', sell: 'فروش', neutral: 'خنثی' };
function pmTrendDir(t) { return t === 'bullish' ? 'buy' : t === 'bearish' ? 'sell' : 'neutral'; }

function pmBuildPathMap(inp) {
  var sources = [];
  function push(id, labelFa, dir, detailFa, available) {
    sources.push({ id: id, labelFa: labelFa, dir: dir, detailFa: detailFa, available: available });
  }
  if (inp.thermo1d) push('thermo1d', 'دماسنج فشار — روزانه (' + (inp.thermo1d.source === 'tradingview' ? 'تریدینگ‌ویو' : 'محلی') + ')', inp.thermo1d.dir, inp.thermo1d.zoneFa + ' · عدد ' + anFaNum(inp.thermo1d.score), true);
  else push('thermo1d', 'دماسنج فشار — روزانه (تریدینگ‌ویو)', 'neutral', 'در دسترس نبود', false);
  if (inp.thermo4h) push('thermo4h', 'دماسنج فشار — ۴ ساعته (' + (inp.thermo4h.source === 'tradingview' ? 'تریدینگ‌ویو' : 'محلی') + ')', inp.thermo4h.dir, inp.thermo4h.zoneFa + ' · عدد ' + anFaNum(inp.thermo4h.score), true);
  else push('thermo4h', 'دماسنج فشار — ۴ ساعته (تریدینگ‌ویو)', 'neutral', 'در دسترس نبود', false);
  if (inp.structure4h) push('struct4h', 'ساختار بازار — ۴ ساعته', pmTrendDir(inp.structure4h), 'روند ' + BT_TREND_FA[inp.structure4h], true);
  else push('struct4h', 'ساختار بازار — ۴ ساعته', 'neutral', 'در دسترس نبود', false);
  if (inp.structure1d) push('struct1d', 'ساختار بازار — روزانه', pmTrendDir(inp.structure1d), 'روند ' + BT_TREND_FA[inp.structure1d], true);
  else push('struct1d', 'ساختار بازار — روزانه', 'neutral', 'در دسترس نبود', false);
  if (inp.tvDailyStateFa) {
    var tvd = inp.tvDailyStateFa.indexOf('خرید') >= 0 ? 'buy' : inp.tvDailyStateFa.indexOf('فروش') >= 0 ? 'sell' : 'neutral';
    push('tv', 'رأی فنی تریدینگ‌ویو — روزانه', tvd, inp.tvDailyStateFa, true);
  } else push('tv', 'رأی فنی تریدینگ‌ویو — روزانه', 'neutral', 'در دسترس نبود', false);
  if (inp.lite && inp.lite.baseScenario) push('lite', 'پیش‌بینی LiteFinance', inp.lite.baseScenario === 'long' ? 'buy' : 'sell', inp.lite.baseScenario === 'long' ? 'سناریوی اصلی گزارش: خرید' : 'سناریوی اصلی گزارش: فروش', true);
  else push('lite', 'پیش‌بینی LiteFinance', 'neutral', 'در دسترس نبود', false);
  if (inp.newsResolved) push('news', 'اخبار مهم امروز/فردا', inp.newsResolved.dir, inp.newsResolved.detailFa, true);
  else push('news', 'اخبار مهم امروز/فردا', 'neutral', 'خبر حل‌شده‌ای که جهت طلا را روشن کند نبود', false);

  var buy = 0, sell = 0, neutral = 0, i;
  for (i = 0; i < sources.length; i++) {
    if (!sources[i].available) continue;
    if (sources[i].dir === 'buy') buy++;
    else if (sources[i].dir === 'sell') sell++;
    else neutral++;
  }
  var total = sources.length;
  var dominant;
  if (inp.rangeActive || (neutral >= buy && neutral >= sell && buy === sell)) dominant = 'range';
  else if (buy > sell) dominant = 'bull';
  else if (sell > buy) dominant = 'bear';
  else dominant = 'range';
  var dominantVotes = dominant === 'bull' ? buy : dominant === 'bear' ? sell : neutral;
  var confidenceFa = dominantVotes >= 5 ? 'هم‌راستایی قوی' : dominantVotes >= 4 ? 'هم‌راستایی متوسط' : 'هم‌راستایی ضعیف — مسیر دوپهلوست';
  var dominantFa = dominant === 'bull' ? 'مسیر غالب: صعودی' : dominant === 'bear' ? 'مسیر غالب: نزولی' : 'مسیر غالب: رنج/انتظار';

  var res = inp.resistance, sup = inp.support;
  var liteHigh = inp.lite && inp.lite.tomorrowHigh !== undefined ? inp.lite.tomorrowHigh : null;
  var liteLow = inp.lite && inp.lite.tomorrowLow !== undefined ? inp.lite.tomorrowLow : null;
  var bullStrength = dominant === 'bull' ? confidenceFa + ' (' + faDigits(buy) + ' از ' + faDigits(total) + ' منبع با خرید هم‌راستا)' : 'هم‌راستایی ضعیف (' + faDigits(buy) + ' از ' + faDigits(total) + ' منبع)';
  var bearStrength = dominant === 'bear' ? confidenceFa + ' (' + faDigits(sell) + ' از ' + faDigits(total) + ' منبع با فروش هم‌راستا)' : 'هم‌راستایی ضعیف (' + faDigits(sell) + ' از ' + faDigits(total) + ' منبع)';
  var rangeStrength = inp.rangeActive && inp.rangeSeverity === 'tight' ? 'هشدار رنج فشرده فعال است — آمار نوسان پایین است' : faDigits(neutral + (inp.rangeActive ? 0 : 1)) + ' نشانهٔ خنثی/رنج از ' + faDigits(total) + ' منبع';

  var scenarios = [
    {
      id: 'bull', titleFa: 'مسیر صعودی', strengthFa: bullStrength,
      triggerFa: res !== null ? 'تثبیت یک کندل بالای مقاومت ' + anFaNum(res) : 'تثبیت بالای سقف محدودهٔ اخیر',
      invalidateFa: sup !== null ? 'شکست و تثبیت زیر حمایت ' + anFaNum(sup) : 'شکست کف محدودهٔ اخیر',
      targetsFa: liteHigh !== null ? 'هدف مسیر (پیش‌بینی LiteFinance برای فردا): ' + anFaNum(liteHigh) : null,
      noteFa: dominant === 'bull' ? 'بیشتر منابع با خرید هم‌راستا هستند — در این سناریو خرید در اصلاح به سمت حمایت/ناحیهٔ ورود، کم‌ریسک‌تر از تعقیب قیمت است.' : 'این سناریو فعال می‌شود فقط اگر محرک بالا رخ دهد — پیش از تثبیت، پیش‌دستی نکنید.'
    },
    {
      id: 'bear', titleFa: 'مسیر نزولی', strengthFa: bearStrength,
      triggerFa: sup !== null ? 'شکست و تثبیت زیر حمایت ' + anFaNum(sup) : 'شکست کف محدودهٔ اخیر',
      invalidateFa: res !== null ? 'برگشت و تثبیت بالای مقاومت ' + anFaNum(res) : 'برگشت بالای سقف محدودهٔ اخیر',
      targetsFa: liteLow !== null ? 'هدف مسیر (پیش‌بینی LiteFinance برای فردا): ' + anFaNum(liteLow) : null,
      noteFa: dominant === 'bear' ? 'بیشتر منابع با فروش هم‌راستا هستند — در این سناریو فروش در برگشت به سمت مقاومت، کم‌ریسک‌تر از فروش در کف است.' : 'این سناریو فعال می‌شود فقط اگر محرک بالا رخ دهد — پیش از شکست واقعی، فروش نکنید.'
    },
    {
      id: 'range', titleFa: 'مسیر رنج / تردید', strengthFa: rangeStrength,
      triggerFa: sup !== null && res !== null ? 'نوسان بین ' + anFaNum(sup) + ' و ' + anFaNum(res) + ' ادامه یابد' : 'بازار در محدودهٔ اخیر بماند',
      invalidateFa: sup !== null && res !== null ? 'شکست هر یک از دو مرز ' + anFaNum(sup) + ' یا ' + anFaNum(res) + ' با کندل قوی' : 'خروج قوی از محدودهٔ اخیر',
      targetsFa: sup !== null && res !== null ? 'لبه‌های محدوده: کف ' + anFaNum(sup) + ' — سقف ' + anFaNum(res) : null,
      noteFa: inp.rangeActive && inp.rangeSeverity === 'tight' ? 'رنج فشرده معمولاً پیش از حرکت بزرگ است — ورود وسط محدوده توصیه نمی‌شود؛ صبر کنید بازار مسیر را انتخاب کند.' : 'در رنج، خرید نزدیک کف و فروش نزدیک سقف (با تثبیت برگشتی) منطقی است؛ وسط محدوده معامله نکنید.'
    }
  ];
  return {
    sources: sources,
    alignment: { buy: buy, sell: sell, neutral: neutral, total: total },
    dominant: dominant, dominantFa: dominantFa, confidenceFa: confidenceFa,
    scenarios: scenarios,
    noteFa: 'نقشهٔ مسیر، هم‌راستایی منابع ابزار را در سه سناریو خلاصه می‌کند — پیش‌بینی قطعی نیست و توصیهٔ خرید/فروش نیست؛ محرک و ابطال هر سناریو را در چارت خودتان بررسی کنید.'
  };
}

function btThermoLocalFor(tf) {
  var key = BT.sym + ':' + tf;
  if (BT_PT_CACHE.data && BT_PT_CACHE.key === key) return Promise.resolve(BT_PT_CACHE.data);
  var conf = BT_SYMS[BT.sym];
  var def = PT_TFS[tf] || PT_TFS['1d'];
  function localCompute() {
    var minBars = def.agg4h ? 60 : 200;
    return btFetchSeries(conf.yahoo, def.range, def.interval).then(function (ser) {
      if (!ser || ser.c.length < minBars) throw new Error('thin');
      var out = ser;
      if (def.agg4h) out = thAggregate4h(ser, thH4Phase());
      var d = thCompute(out);
      d.tf = tf; d.tfLabel = def.label; d.symName = conf.name; d.atISO = new Date().toISOString();
      d.source = 'local'; d.sourceNoteFa = 'منبع رأی: موتور محلی (تریدینگ‌ویو در دسترس نبود)';
      BT_PT_CACHE = { at: Date.now(), key: key, data: d };
      return d;
    }).catch(function () { return null; });
  }
  /* اول تریدینگ‌ویو (CORS باز — مستقیم)؛ در نبود آن، موتور محلی روی کندل‌های پروکسی */
  if (!conf.tv) return localCompute();
  return btTvTechnicals(conf.tv, tf).then(function (tv) {
    if (tv) return btThermoFromTv(conf, tv, tf, def.label);
    return localCompute();
  }).catch(function () { return localCompute(); });
}

function anNewsResolved() {
  var evs = (typeof news !== 'undefined' && news && news.events) ? news.events : [];
  var now = Date.now(), buy = 0, sell = 0, resolved = 0;
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    if (e.impact !== 'High' || !e.dateISO || !e.actual || !e.forecast) continue;
    var t = new Date(e.dateISO).getTime();
    if (!isFinite(t) || t < now - 36 * 3600000 || t > now + 36 * 3600000) continue;
    function numFrom(s) { var n = Number(String(s).replace(/[,%\s]/g, '')); return isFinite(n) ? n : null; }
    var a = numFrom(e.actual), f = numFrom(e.forecast);
    if (a === null || f === null || a === f) continue;
    var d = a > f ? e.xauAbove : e.xauBelow;
    if (!d) continue;
    resolved++;
    if (d === 'bullish') buy++;
    else if (d === 'bearish') sell++;
  }
  if (!resolved) return null;
  var dir = buy > sell ? 'buy' : sell > buy ? 'sell' : 'neutral';
  var detailFa = dir === 'neutral'
    ? faDigits(resolved) + ' خبر مهم امروز/فردا منتشر شد — اثر خنثی یا دووجهی بر طلا'
    : faDigits(resolved) + ' خبر مهم حل‌شده — بیشترشان متمایل به ' + (dir === 'buy' ? 'تقویت' : 'تضعیف') + ' طلا بود';
  return { dir: dir, detailFa: detailFa };
}

function anHotHours() {
  var evs = (typeof news !== 'undefined' && news && news.events) ? news.events : [];
  var now = Date.now(), out = [];
  var withT = [];
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    if (e.impact !== 'High' || !e.dateISO) continue;
    var t = new Date(e.dateISO).getTime();
    if (!isFinite(t) || t < now - 6 * 3600000 || t > now + 36 * 3600000) continue;
    withT.push({ e: e, t: t });
  }
  withT.sort(function (a, b) { return a.t - b.t; });
  for (var k = 0; k < withT.length && k < 4; k++) {
    out.push({ timeFa: faTime(new Date(withT[k].t)), titleFa: withT[k].e.titleFa || withT[k].e.title });
  }
  return out;
}

function btPathCompute() {
  if (AN.pathBusy) return;
  AN.pathBusy = true; AN.pathErr = null;
  renderAnalysisApp(true);
  var conf = BT_SYMS[BT.sym];
  var symRow = typeof ms !== 'undefined' && ms && ms[BT.sym] ? ms[BT.sym] : null;
  var row4h = btRowOf(BT.sym, '4h'), row1d = btRowOf(BT.sym, '1d');
  var structure4h = BT.data && BT.data.structure4h ? BT.data.structure4h : (row4h && row4h.trend ? row4h.trend : null);
  var structure1d = row1d && row1d.trend ? row1d.trend : null;
  var price = BT.data && BT.data.price ? BT.data.price : (symRow && symRow.price ? symRow.price : null);
  var support = BT.data && BT.data.ll ? BT.data.ll : null;
  var resistance = BT.data && BT.data.hh ? BT.data.hh : null;
  var rangeActive = !!(BT.data && BT.data.rangeWarning && BT.data.rangeWarning.active);
  var rangeSeverity = BT.data && BT.data.rangeWarning ? BT.data.rangeWarning.severity : null;
  var newsResolved = anNewsResolved();
  if (!AN.br && !AN.busy) btLoadBriefing(false);
  Promise.all([
    btThermoLocalFor('1d'),
    btThermoLocalFor('4h'),
    AN.br ? Promise.resolve(AN.br) : Promise.resolve(null)
  ]).then(function (rs) {
    var br = rs[2];
    var inp = {
      price: price, support: support, resistance: resistance,
      structure4h: structure4h, structure1d: structure1d,
      rangeActive: rangeActive, rangeSeverity: rangeSeverity,
      thermo1d: rs[0] ? { dir: rs[0].dir, zoneFa: rs[0].zoneFa, score: rs[0].score, source: rs[0].source } : null,
      thermo4h: rs[1] ? { dir: rs[1].dir, zoneFa: rs[1].zoneFa, score: rs[1].score, source: rs[1].source } : null,
      tvDailyStateFa: br && br.tv && br.tv.ok ? br.tv.stateFa : null,
      lite: br && br.lite && br.lite.ok && br.lite.baseScenario ? { baseScenario: br.lite.baseScenario, tomorrowHigh: br.lite.tomorrow.high, tomorrowLow: br.lite.tomorrow.low } : null,
      newsResolved: newsResolved
    };
    AN.path = pmBuildPathMap(inp);
    AN.path.hotHours = anHotHours();
    AN.pathBusy = false;
    renderAnalysisApp(true);
  });
}

/* ================= رندر رابط کاربری دستیار معامله‌گر ================= */

function btSymChips() {
  var h = '<div class="bt-syms">';
  var list = [['xau', 'طلا — XAUUSD'], ['dji', 'داوجونز — DJI']];
  for (var i = 0; i < list.length; i++)
    h += '<button type="button" class="cchip' + (BT.sym === list[i][0] ? ' on' : '') + '" data-bt-sym="' + list[i][0] + '">' + list[i][1] + '</button>';
  return h + '</div>';
}
function btTabBar() {
  var h = '<div class="bt-tabs">';
  for (var i = 0; i < BT_TABS.length; i++)
    h += '<button type="button" class="cchip' + (BT.tab === BT_TABS[i][0] ? ' on' : '') + '" data-bt-tab="' + BT_TABS[i][0] + '">' + BT_TABS[i][1] + '</button>';
  return h + '</div>';
}
function btSec(title, ic, body, tone) {
  return '<section class="bt-sec"><div class="bt-sec-h" style="' + (tone ? 'color:' + tone : '') + '">' + icon(ic, 14) + '<h2>' + title + '</h2></div>' + body + '</section>';
}
function btPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (v > 0 ? '+' : '') + faDigits(Math.round(v * 100) / 100) + '٪';
}
function btNum(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return faDigits(Math.round(v * 100) / 100);
}
function btDot(t) {
  var cls = t === 'bullish' ? 'bull' : t === 'bearish' ? 'bear' : 'neut';
  return '<span class="tdot ' + cls + '">' + icon(t === 'bullish' ? 'trendUp' : t === 'bearish' ? 'trendDown' : 'moveH', 10) + (t ? BT_TREND_FA[t] : '—') + '</span>';
}

/* ---------- تب نمای بازار (بدون شناسنامه نماد + ماشین‌حساب حجم/حد ضرر و حد سود) ---------- */
function btViewHTML() {
  var d = BT.data;
  var scoreCls = d.verdict === 'strong' ? 'ok' : d.verdict === 'moderate' ? 'mid' : 'bad';
  var rows = [
    ['هم‌جهتی تایم‌فریم‌ها', d.factors.tf, 40],
    ['خلأ خبری', d.factors.news, 30],
    ['همبستگی با DXY', d.factors.dxy, 20],
    ['نوسان ATR', d.factors.atr, 10]
  ];
  var brk = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    brk += '<div class="bt-frow"><div class="bt-frow-t"><span>' + r[0] + '</span><span class="bt-frow-v">' + faDigits(r[1].score) + '/' + faDigits(r[2]) + ' — ' + r[1].label + '</span></div>' +
      '<div class="bt-bar"><span style="width:' + Math.round(r[1].score / r[2] * 100) + '%"></span></div>' +
      '<p class="bt-frow-d">' + r[1].detail + '</p></div>';
  }
  var tbl = '';
  var tfs = ['15m', '1h', '4h', '1d'];
  for (i = 0; i < tfs.length; i++) {
    var row = btRowOf(BT.sym, tfs[i]);
    tbl += '<tr><td>' + BT_TF_FA[tfs[i]] + '</td><td>' + btDot(row && row.trend) + '</td><td>' + (row && row.trend ? faDigits(row.strength) + '٪' : '—') + '</td></tr>';
  }
  var changes = BT.changes.length
    ? '<ul class="bt-list">' + BT.changes.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>'
    : '<p class="bt-note">تغییر قابل‌توجهی نسبت به بازدید قبلی شما ثبت نشده است (یا این اولین بازدید است).</p>';

  return btSec('موتور همگرایی پویا — امتیاز اطمینان', 'gauge',
    '<div class="bt-score-row"><div class="bt-score ' + scoreCls + '"><b>' + faDigits(d.total) + '</b><span>از ۱۰۰</span></div>' +
    '<div class="bt-score-txt"><p class="bt-score-v">' + trVerdictLabel(d.verdict) + '</p>' +
    '<p class="bt-note">≥۷۵ قوی · ۵۰–۷۴ متوسط · کمتر از ۵۰ بدون معامله — امتیاز، فرصت را اندازه می‌گیرد، نه نتیجه را تضمین می‌کند.</p></div></div>' + brk, 'var(--violet)') +
    btSec('تحلیل ساختار بازار — جمع‌بندی ' + d.summary, 'activity',
      '<table class="mini-tbl"><thead><tr><th>تایم‌فریم</th><th>جهت</th><th>قدرت</th></tr></thead><tbody>' + tbl + '</tbody></table>' +
      '<p class="bt-note">' + d.tfF.detail + ' برداشت از وضعیت تأییدشده جداست؛ سطوح ۲۰ روز اخیر — مقاومت: ' + btNum(d.hh) + ' · حمایت: ' + btNum(d.ll) + '.</p>' +
      '<p class="bt-src">داده ساختار: اسنپ‌شات فایل — برای ساختار زنده از اپ «ساختار بازار» با بروزرسانی زنده استفاده کنید.</p>', 'var(--sky)') +
    btSec('رژیم بازار', 'activity', '<p class="bt-strong">' + d.regime.label + '</p><p class="bt-note">' + d.regime.reason + '</p>', 'var(--sky)') +
    btSec('وابستگی به DXY و US10Y', 'dollar',
      '<div class="bt-grid3">' +
      '<div class="bt-cell"><p>DXY</p><b dir="ltr">' + (d.dxyPrice ? faNum(d.dxyPrice) : '—') + '</b><span>' + btPct(d.dxyChangePct) + '</span></div>' +
      '<div class="bt-cell"><p>US10Y</p><b dir="ltr">' + (d.tnxPrice ? faNum(d.tnxPrice) : '—') + '</b><span>' + btPct(d.tnxChangePct) + '</span></div>' +
      '<div class="bt-cell"><p>همبستگی با DXY</p><b dir="ltr">' + (d.corr === null ? '—' : faDigits(Math.round(d.corr * 100) / 100)) + '</b><span>۳۰ بازده روزانه</span></div>' +
      '</div>' +
      '<p class="bt-note">' + (d.conf.inv ? 'رابطه معمول این نماد با دلار معکوس است؛ ' : 'جهت رابطه این نماد با دلار ثابت فرض نمی‌شود؛ ') + 'حرکت هم‌زمان دلیل علّی نیست و DXY فقط یکی از عوامل زمینه‌ای است.</p>', 'var(--amber)') +
    btSec('چه چیزی از آخرین بازدید تغییر کرده؟', 'refresh', changes + '<p class="bt-note">فقط تغییر واقعی داده‌ها نمایش داده می‌شود؛ هشدار، دستور ورود یا خروج نیست.</p>', 'var(--violet)') +
    btCalcHTML();
}

/* ---------- ماشین‌حساب پیپ/حجم و حد ضرر و حد سود (انتهای نمای بازار) ---------- */
function btCalcHTML() {
  var d = BT.data;
  var p = BT.plan;
  var result = '';
  if (p && p.ok) {
    var warns = '';
    for (var i = 0; i < p.warnings.length; i++) warns += '<p class="bt-warn-l">⚠ ' + p.warnings[i] + '</p>';
    result = '<div class="bt-plan-res">' +
      '<div class="bt-plan-grid">' +
      '<span>حد ضرر: <b class="r" dir="ltr">' + p.sl + '</b></span><span>حد سود: <b class="g" dir="ltr">' + p.tp + '</b></span>' +
      '<span>حجم: <b class="a" dir="ltr">' + p.lots + '</b> لات</span><span>ریسک: <b dir="ltr">$' + p.riskAmount + '</b></span>' +
      '<span>زیان در SL: <b class="r" dir="ltr">$' + p.lossAtSL + '</b></span><span>سود در TP: <b class="g" dir="ltr">$' + p.profitAtTP + '</b></span>' +
      '</div>' +
      '<div class="bt-copy"><code dir="ltr">' + p.copyText + '</code><button type="button" class="ai-rf" data-bt-copy aria-label="کپی خلاصه محاسبه">' + icon('copy', 11) + '</button></div>' + warns + '</div>';
  } else if (p && !p.ok) {
    result = '<p class="bt-warn red">' + p.error + '</p>';
  }
  var zf = BT.zf || {};
  return btSec('ماشین‌حساب پیپ/حجم و حد ضرر و حد سود', 'crosshair',
    '<div class="bt-form2">' +
    '<label>جهت<select id="bt_side"><option value="buy"' + (zf.side === 'buy' ? ' selected' : '') + '>خرید (Buy)</option><option value="sell"' + (zf.side === 'sell' ? ' selected' : '') + '>فروش (Sell)</option></select></label>' +
    '<label>نقطه ورود<input id="bt_entry" inputmode="decimal" dir="ltr" placeholder="' + (d.price ? Math.round(d.price * 100) / 100 : '4200') + '" value="' + (zf.entry || '') + '"></label>' +
    '<label>موجودی حساب ($)<input id="bt_balance" inputmode="decimal" dir="ltr" placeholder="1000" value="1000"></label>' +
    '<label>ریسک (٪)<input id="bt_risk" inputmode="decimal" dir="ltr" placeholder="1" value="1"></label>' +
    '<label>نسبت R/R<select id="bt_rr"><option value="2">۱ به ۲</option><option value="3">۱ به ۳</option></select></label>' +
    '<label>مبنای حد ضرر<select id="bt_slmode"><option value="atr">ATR × ۱.۵ (خودکار)</option><option value="swing">آخرین سوئینگ</option></select></label>' +

    (!p.reliable ? '<p class="bt-warn">⚠ تعداد اندیکاتورهای قابل محاسبه کم است — این نتیجه اعتماد پایینی دارد.</p>' : '') +
    '<p class="bt-src">قیمت لحظه‌ای همین نماد در «نمای بازار» و «اسکلپ» از همین منبع کالیبره می‌شود · آخرین محاسبه: ' + faTime(new Date(p.atISO)) + '</p>' +

/* تزریق ویجت رسمی Technicals تریدینگ‌ویو (اسکریپت باید با createElement اضافه شود تا اجرا شود) */
function injectTvTaWidget(hostId, tvSym) {
  var host = document.getElementById(hostId);
  if (!host) return;
  if (host.getAttribute('data-tv') === tvSym && host.firstChild) return;
  host.innerHTML = '';
  host.setAttribute('data-tv', tvSym);
  var c = document.createElement('div');
  c.className = 'tradingview-widget-container';
  var w = document.createElement('div');
  w.className = 'tradingview-widget-container__widget';
  c.appendChild(w);
  var s = document.createElement('script');
  s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
  s.async = true;
  s.type = 'text/javascript';
  s.innerHTML = JSON.stringify({ symbol: tvSym, interval: '1D', width: '100%', height: 380, isTransparent: true, locale: 'en', showIntervalTabs: true });
  c.appendChild(s);
  host.appendChild(c);
}

/* ---------- رندر اصلی اپ ---------- */
function renderTraderApp(soft) {
  if (!soft) { BT.tab = btGet('bt_tab_v1', 'view'); }
  if (BT.tab === 'plan' || BT.tab === 'journal') BT.tab = 'view'; /* تب‌های حذف‌شده → نمای بازار */
  var inner = btHead() + btSymChips() + btTabBar();

  /* نوار واگرایی همیشه فعال */
  if (BT.data) {
    var dv = BT.data.div;
    var dot = dv.color === 'green' ? '🟢' : dv.color === 'amber' ? '🟡' : dv.color === 'red' ? '🔴' : '⚪';
    inner += '<div class="bt-divbar ' + dv.color + '"><span class="e">' + dot + '</span><div class="t"><b>' + dv.text + '</b><span>' + dv.reason + '</span></div></div>';
  }
  if (BT.nudge) inner += '<div class="bt-warn">⚠ ' + BT.nudge + '</div>';
  if (BT.data && BT.data.degraded) inner += '<div class="bt-warn">حالت کاهش‌یافته: دریافت داده زنده Yahoo ناموفق بود — فقط اسنپ‌شات فایل نمایش داده می‌شود؛ عوامل وابسته به داده زنده با برچسب «داده ناکافی» علامت خورده‌اند. با دکمه بروزرسانی دوباره تلاش کنید.</div>';
  /* هشدار جدی رنج فشرده / رنج — همیشه بالای همه تب‌ها */
  if (BT.data && BT.data.rangeWarning && BT.data.rangeWarning.active) {
    var rwv = BT.data.rangeWarning;
    inner += '<div class="bt-rangewarn' + (rwv.severity === 'tight' ? ' red' : '') + '">' +
      '<b>' + (rwv.severity === 'tight' ? 'هشدار جدی: رنج فشرده' : 'هشدار: بازار رنج است') + '</b>' +
      '<p>' + rwv.message + '</p>' +
      (rwv.severity === 'tight' ? '<ul>' + rwv.advice.map(function (a) { return '<li>' + a + '</li>'; }).join('') + '</ul>' : '') +
      '<span class="m">سنجه‌ها: صدک ATR ' + (rwv.metrics.atrPctile === null ? '—' : faDigits(rwv.metrics.atrPctile)) + ' · نسبت کارایی ' + (rwv.metrics.er === null ? '—' : faDigits(rwv.metrics.er)) + ' · ارتفاع محدوده ' + (rwv.metrics.boxPctOfAtr === null ? '—' : faDigits(rwv.metrics.boxPctOfAtr)) + ' برابر ATR</span></div>';
  }

  if (BT.busy) {
    inner += '<div class="bt-state"><span class="spin">' + icon('refresh', 20) + '</span>در حال دریافت سری روزانه و محاسبه وضعیت بازار…<span class="s">ساختار، DXY، US10Y، اخبار و امتیاز اطمینان</span></div>';
  } else if (BT.err && !BT.data) {
    inner += '<div class="bt-state"><span style="color:var(--red)">' + icon('wifi', 22) + '</span>' + BT.err +
      '<button type="button" class="btn" data-bt-refresh>' + icon('refresh', 13) + 'تلاش مجدد</button></div>';
  } else if (BT.data) {
    if (BT.tab === 'ai') inner += btAiHTML();
    else if (BT.tab === 'factors') inner += btThermoHTML();
    else if (BT.tab === 'news') inner += btNewsHTML();
    else inner += btViewHTML();
    inner += '<p class="bt-foot">منبع: ' + (BT.data.degraded ? 'اسنپ‌شات فایل (داده زنده در دسترس نبود)' : 'سری روزانه Yahoo Finance (پروکسی عمومی) · ساختار و اخبار: اسنپ‌شات فایل') + ' — آخرین محاسبه: ' + faTime(new Date()) +
      '<br>هیچ خروجی این بخش توصیه قطعی خرید/فروش یا اجرای خودکار سفارش نیست.</p>';
  }
  appScroll.innerHTML = '<div class="bt-wrap">' + inner + '</div>';
  btBind();
  /* ویجت رسمی Technicals تریدینگ‌ویو در تب دماسنج */
  if (BT.tab === 'factors' && BT.pt && BT.pt.tvSymbol) injectTvTaWidget('tv-ta-host', BT.pt.tvSymbol);
  /* بارگذاری اولیه — فقط وقتی هیچ داده یا وضعیتی وجود ندارد */
  if (!BT.data && !BT.busy && !BT.err) btLoadData(false);
  /* بارگذاری تنبل عوامل کمّی هنگام باز شدن تب */
  if (BT.tab === 'factors' && BT.data && !BT.pt && !BT.ptBusy && !BT.ptErr) btLoadPressure(false);
}
function btBind() {
  var rf = appScroll.querySelector('[data-bt-refresh]');
  if (rf) rf.addEventListener('click', function () {
    var log = btGet(BT_KEYS.refresh, []);
    log.push(Date.now());
    btSet(BT_KEYS.refresh, log);
    var n = trRefreshNudge(log);
    BT.nudge = n.warn ? n.message : '';
    btLoadData(true);
  });
  var ptr = appScroll.querySelector('[data-pt-reload]');
  if (ptr) ptr.addEventListener('click', function () { btLoadPressure(true); });
  var ptfs = appScroll.querySelectorAll('[data-pt-tf]');
  for (var wi = 0; wi < ptfs.length; wi++) {
    (function (b) {
      b.addEventListener('click', function () {
        if (BT.ptTf === b.dataset.ptTf && BT.pt) return;
        BT.ptTf = b.dataset.ptTf;
        BT.pt = null;
        btLoadPressure(false, BT.ptTf);
      });
    })(ptfs[wi]);
  }
  var syms = appScroll.querySelectorAll('[data-bt-sym]');
  for (var i = 0; i < syms.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        if (BT.sym === b.dataset.btSym) return;
        BT.sym = b.dataset.btSym; BT.data = null; BT.plan = null; BT.changes = []; BT.pt = null; BT.ptErr = null; BT.zf = null;
        btLoadData(true);
      });
    })(syms[i]);
  }
  var tabs = appScroll.querySelectorAll('[data-bt-tab]');
  for (i = 0; i < tabs.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        BT.tab = b.dataset.btTab;
        btSet('bt_tab_v1', BT.tab);
        renderTraderApp(true);
      });
    })(tabs[i]);
  }
  /* ماشین‌حساب حجم/حد ضرر و حد سود */
  var gen = appScroll.querySelector('[data-bt-gen]');
  if (gen) gen.addEventListener('click', function () {
    var d = BT.data;
    var side = appScroll.querySelector('#bt_side').value;
    var entry = Number((appScroll.querySelector('#bt_entry').value || '').replace(/[^\d.]/g, ''));
    var balance = Number((appScroll.querySelector('#bt_balance').value || '').replace(/[^\d.]/g, ''));
    var riskPct = Number((appScroll.querySelector('#bt_risk').value || '').replace(/[^\d.]/g, ''));
    var rr = Number(appScroll.querySelector('#bt_rr').value);
    var slMode = appScroll.querySelector('#bt_slmode').value;
    var atrAbs = d.price && d.atr !== null ? d.atr / 100 * d.price : null;
    BT.plan = trPlan({
      side: side, entry: entry, balance: balance, riskPct: riskPct, rr: rr, slMode: slMode,
      swingLevel: side === 'buy' ? d.ll : d.hh, atr: atrAbs, contractSize: d.conf.contract,
      symbolLabel: d.conf.label
    });
    BT.copied = false;
    renderTraderApp(true);
  });
  var cp = appScroll.querySelector('[data-bt-copy]');
  if (cp) cp.addEventListener('click', function () {
    if (!BT.plan || !BT.plan.copyText) return;
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(BT.plan.copyText);
      else {
        var ta = document.createElement('textarea');
        ta.value = BT.plan.copyText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
    } catch (e) {}
  });

/* ---------- تراز کندل ۴ساعته (رفع «خطوط از دو سه کندل قبل») ----------
 * broker/ny: مرزها در ۱۷:۰۰ نیویورک = ۲۱:۰۰ UTC تابستان / ۲۲:۰۰ زمستان
 * (همان تراز چارت OANDA/تریدینگ‌ویو و سرور GMT+2/+3 بروکرها) */
function scAnchorOf(sym) { return S_SCALP.anchor || (sym === 'btc' ? 'utc' : 'broker'); }
function scPhase(nowSec, anchor) {
  if (anchor !== 'broker') return 0;
  var ms = nowSec * 1000, d = new Date(ms), y = d.getUTCFullYear();
  function dow(u) { return new Date(u).getUTCDay(); }
  var mar1 = Date.UTC(y, 2, 1), firstSunMar = mar1 + ((7 - dow(mar1)) % 7) * 86400000;
  var dstStart = firstSunMar + 7 * 86400000;
  var nov1 = Date.UTC(y, 10, 1), dstEnd = nov1 + ((7 - dow(nov1)) % 7) * 86400000;
  return ms >= dstStart && ms < dstEnd ? 3600 : 7200;
}
function scBucketIdx(t, phase) { return Math.floor((t - phase) / 14400); }
/* جست‌وجوی کندل بستهٔ قبلی — حداکثر ۲ باکت عقب‌تر با ثبت گپ (رفع fallback خاموش ۱۲باکتی) */
function scPickRef(map, bucket) {
  var e = map[bucket - 1];
  if (e) return { ref: e, gap: 0, refBucket: bucket - 1 };
  e = map[bucket - 2];
  if (e) return { ref: e, gap: 1, refBucket: bucket - 2 };
  e = map[bucket - 3];
  if (e) return { ref: e, gap: 2, refBucket: bucket - 3 };
  return { ref: null, gap: 3, refBucket: bucket - 1 };
}

var SCALP_CACHE = {}; /* key → { at, payload } */
var SCALP_BUSY = false;

/* ---------- ابزارهای سری ---------- */
function scAtr(bars, len) {
  var out = [], i;
  for (i = 0; i < bars.length; i++) out.push(NaN);
  if (bars.length < len + 1) return out;
  var trs = [bars[0].h - bars[0].l];
  for (i = 1; i < bars.length; i++)
    trs.push(Math.max(bars[i].h - bars[i].l, Math.abs(bars[i].h - bars[i - 1].c), Math.abs(bars[i].l - bars[i - 1].c)));
  var a = 0;
  for (i = 0; i < len; i++) a += trs[i];
  out[len] = a / len;
  for (i = len + 1; i < bars.length; i++) { a = (a * (len - 1) + trs[i]) / len; out[i] = a; }
  return out;
}
function scRma(v, len) {
  var out = [], sum = 0, prev = NaN, i;
  for (i = 0; i < v.length; i++) {
    if (i < len) { sum += v[i]; if (i === len - 1) { prev = sum / len; out.push(prev); } else out.push(NaN); }
    else { prev = (prev * (len - 1) + v[i]) / len; out.push(prev); }
  }
  return out;
}
function scRsi(c, len) {
  len = len || 14;
  var ch = [0], i;
  for (i = 1; i < c.length; i++) ch.push(c[i] - c[i - 1]);
  var g = ch.map(function (d) { return d > 0 ? d : 0; });
  var l = ch.map(function (d) { return d < 0 ? -d : 0; });
  var ag = scRma(g, len), al = scRma(l, len), out = [];
  for (i = 0; i < c.length; i++) {
    if (isNaN(ag[i]) || isNaN(al[i])) { out.push(NaN); continue; }
    out.push(al[i] === 0 ? (ag[i] === 0 ? 50 : 100) : 100 - 100 / (1 + ag[i] / al[i]));
  }
  return out;
}
function scMacdHist(c) {
  function ema(len) {
    var k = 2 / (len + 1), e = c[0], out = [], i;
    for (i = 0; i < c.length; i++) { e = i === 0 ? c[0] : c[i] * k + e * (1 - k); out.push(e); }
    return out;
  }
  var f = ema(12), s = ema(26), line = [], i;
  for (i = 0; i < c.length; i++) line.push(f[i] - s[i]);
  var k = 2 / 10, se = line[0], hist = [];
  for (i = 0; i < line.length; i++) { se = i === 0 ? line[0] : line[i] * k + se * (1 - k); hist.push(line[i] - se); }
  return hist;
}
function scStoch(bars, len) {
  len = len || 14;
  var out = [], i, j;
  for (i = 0; i < bars.length; i++) out.push(NaN);

      if (disp.gap > 0) notes.push('کندل ۴ساعتهٔ بستهٔ بلافصل در دادهٔ منبع یافت نشد؛ خطوط ۴ساعته از ' + (disp.gap === 1 ? 'یک' : 'دو') + ' کندل قبل‌تر گرفته شد (گپ فید یا تعطیلی بازار) — پنجرهٔ کندل ملاک را با چارت بروکر مقایسه کنید.');

  return {
    bars: n, lastClose: last.c, lastT: last.t,
    atr: lastAtr, atrPct: lastAtr ? lastAtr / last.c * 100 : null,
    h4High: h4HighNow, h4Low: h4LowNow,
    h4Ref: h4Ref, h4Anchor: anchor,
    swingHigh: swingHigh, swingLow: swingLow, swingHighBroken: hiBroken, swingLowBroken: loBroken,

}

/* ---------- دریافت داده از Yahoo با پروکسی ----------
 * رفع تازگی: همهٔ پروکسی‌ها همزمان پرسیده می‌شوند و پاسخی که آخرین کندلِ تازه‌تر
 * دارد برنده می‌شود (پروکسی‌های عمومی گاهی پاسخ چندساعتهٔ کش‌شده برمی‌گردانند
 * که دقیقاً عامل «خطوط ۴ساعتهٔ قدیمی» بود) + cache-buster در URL. */
function scParseBars(j) {
  var r = j && j.chart && j.chart.result && j.chart.result[0];

    out.push({ t: r.timestamp[k], o: q.open[k], h: q.high[k], l: q.low[k], c: q.close[k] });
  }

}
function scFetchBars(yahooSym, interval, range) {
  var u = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(yahooSym) + '?interval=' + interval + '&range=' + range + '&includePrePost=false&_cb=' + Date.now();
  var tries = PROXIES.map(function (p) {
    return fetchJSON(p(u), 12000).then(scParseBars);
  });
  return Promise.all(tries.map(function (p) { return p.catch(function () { return null; }); })).then(function (results) {
    var best = null;
    for (var i = 0; i < results.length; i++) {

      if (!best || b[b.length - 1].t > best[best.length - 1].t) best = b;

    return best;
  });
}
function scAgg4h(bars, phase) {
  var H = 14400, map = {}, keys = [], i;
  for (i = 0; i < bars.length; i++) {
    var idx = Math.floor((bars[i].t - phase) / H), b = idx * H + phase;
    if (map[b] === undefined) { map[b] = { t: b, o: bars[i].o, h: bars[i].h, l: bars[i].l, c: bars[i].c }; keys.push(b); }
    else { var e = map[b]; e.h = Math.max(e.h, bars[i].h); e.l = Math.min(e.l, bars[i].l); e.c = bars[i].c; }
  }
  keys.sort(function (a, b) { return a - b; });
  return keys.map(function (k) { return map[k]; });
}

/* ---------- کالیبراسیون اسپات (gold-api) ----------
 * کندل‌های Yahoo برای طلا/نقره از بازار آتی است و نسبت به اسپاتِ چارت کاربر
 * اختلاف دائمی دارد (طلا معمولا حدود ۲۰ دلار). برای هم‌ترازی سطوح با اسپات،
 * قیمت لحظه‌ای اسپات گرفته شده و همهٔ سطوح مطلق با همان اختلاف جابه‌جا می‌شوند.
 * gold-api.com بدون کلید کار می‌کند و Access-Control-Allow-Origin: * دارد؛
 * در صورت شکست، از پروکسی‌های عمومی هم تلاش می‌شود. */
function scFetchSpot(sym) {
  var u = 'https://api.gold-api.com/price/' + sym;
  function parse(j) {
    var p = j && typeof j.price === 'number' ? j.price : parseFloat(j && j.price);
    return isFinite(p) && p > 0 ? p : null;
  }
  return fetchJSON(u, 6000).then(function (j) {
    var p = parse(j);
    if (p !== null) return p;
    throw new Error('bad-spot');
  }).catch(function () {
    var i = 0;
    function attempt() {

      return fetchJSON(PROXIES[i++](u), 8000).then(parse).catch(attempt);
    }
    return attempt();
  });
}
function scShiftEngine(e, d) {
  function sh(v) { return typeof v === 'number' && isFinite(v) ? Math.round((v + d) * 100) / 100 : v; }
  function shZone(z) { return z ? { lo: sh(z.lo), hi: sh(z.hi) } : z; }
  function shArr(arr) {
    if (!Array.isArray(arr)) return arr;
    return arr.map(function (o) {
      if (typeof o.zoneLo === 'number') return Object.assign({}, o, { price: sh(o.price), zoneLo: sh(o.zoneLo), zoneHi: sh(o.zoneHi) });
      if (typeof o.top === 'number') return Object.assign({}, o, { top: sh(o.top), bot: sh(o.bot) });
      return Object.assign({}, o, { o: sh(o.o), h: sh(o.h), l: sh(o.l), c: sh(o.c) });
    });
  }
  if (e.suggestion) {
    e.suggestion.entryLo = sh(e.suggestion.entryLo);
    e.suggestion.entryHi = sh(e.suggestion.entryHi);
    e.suggestion.sl = sh(e.suggestion.sl);
    e.suggestion.tp1 = sh(e.suggestion.tp1);
    e.suggestion.tp2 = sh(e.suggestion.tp2);
  }
  e.lastClose = sh(e.lastClose);
  e.h4High = sh(e.h4High);
  e.h4Low = sh(e.h4Low);
  if (e.h4Ref && typeof e.h4Ref.high === 'number') { e.h4Ref.high = sh(e.h4Ref.high); e.h4Ref.low = sh(e.h4Ref.low); }
  e.swingHigh = sh(e.swingHigh);
  e.swingLow = sh(e.swingLow);
  if (e.setup) { e.setup.sellZone = shZone(e.setup.sellZone); e.setup.buyZone = shZone(e.setup.buyZone); }
  if (e.wave) e.wave.retrLevel = sh(e.wave.retrLevel);
  e.supplyZones = shArr(e.supplyZones);
  e.demandZones = shArr(e.demandZones);
  e.signals = shArr(e.signals);
  if (e.suggestion && typeof e.lastClose === 'number') {
    var sg = e.suggestion, buy = sg.side === 'buy';
    var dist = (e.lastClose >= sg.entryLo && e.lastClose <= sg.entryHi) ? 0 :
      buy ? (e.lastClose < sg.entryLo ? sg.entryLo - e.lastClose : e.lastClose - sg.entryHi)
          : (e.lastClose > sg.entryHi ? e.lastClose - sg.entryHi : sg.entryLo - e.lastClose);
    sg.dist = Math.round(dist * 100) / 100;
    sg.distAtr = typeof e.atr === 'number' && e.atr > 0 ? Math.round(dist / e.atr * 100) / 100 : null;
  }
}

/* ---------- محاسبه + کش ---------- */
function scKey() { return S_SCALP.sym + '@' + S_SCALP.tf + '@' + scAnchorOf(S_SCALP.sym); }
function scalpCompute(force) {
  var key = scKey();
  var cached = SCALP_CACHE[key];
  if (!force && cached && Date.now() - cached.at < 60000) return Promise.resolve(cached.payload);
  var symCfg = SCALP_SYMS[S_SCALP.sym], tfCfg = SCALP_TFS[S_SCALP.tf];
  if (!symCfg || !tfCfg) return Promise.reject(new Error('cfg'));
  SCALP_BUSY = true;
  var h4p = null;
  var anchor = scAnchorOf(S_SCALP.sym);
  var nowSec = Math.floor(Date.now() / 1000);
  var phase = scPhase(nowSec, anchor);
  return scFetchBars(symCfg.y, tfCfg.i, tfCfg.r).then(function (bars) {
    return scFetchBars(symCfg.y, '1h', '3mo').then(function (h1) { h4p = scAgg4h(h1, phase); return bars; }).catch(function () { return bars; });
  }).then(function (bars) {
    var engine = scalpRun(bars, h4p, { nowSec: nowSec, anchor: anchor });
    var rw = null;
    try {
      rw = trRangeComp(bars.map(function (b) { return b.h; }), bars.map(function (b) { return b.l; }), bars.map(function (b) { return b.c; }));
    } catch (e) { rw = null; }
    /* کالیبراسیون اسپات: حذف اختلاف دائمی آتی↔اسپات از همهٔ سطوح */
    var basisInfo = null;
    var spotP = symCfg.spot ? scFetchSpot(symCfg.spot) : Promise.resolve(null);
    return spotP.then(function (spot) {
      if (spot !== null && isFinite(engine.lastClose)) {
        var basis = Math.round((spot - engine.lastClose) * 100) / 100;
        if (Math.abs(basis) > 0.01) scShiftEngine(engine, basis);
        basisInfo = {
          applied: Math.abs(basis) > 0.01, spot: spot, futures: engine.lastClose - (Math.abs(basis) > 0.01 ? basis : 0), basis: basis,
          note: 'کندل‌های منبع از بازار آتی (Yahoo) است؛ همهٔ سطوح با اختلاف لحظه‌ای آتی↔اسپات (' + (basis > 0 ? '+' : '') + scPx(basis) + ' دلار) کالیبره شدند تا با چارت اسپات هم‌تراز باشند.'
        };
      } else {
        basisInfo = { applied: false, futures: engine.lastClose, note: 'کالیبراسیون اسپات انجام نشد (سرویس قیمت لحظه‌ای در دسترس نبود) — سطوح مستقیماً از بازار آتی هستند و با چارت اسپات اختلاف دارند (تاریخچهٔ معمول: حدود ۲۰ دلار برای طلا).' };

      var lastAge = Math.max(0, Math.floor(Date.now() / 1000) - engine.lastT);
      var stale = lastAge > Math.max(3 * tfSec, 900);
      var payload = {
        ok: true, sym: S_SCALP.sym, symbolLabel: symCfg.label, symbolMono: symCfg.mono,
        tf: S_SCALP.tf, tfLabel: tfCfg.label, anchor: anchor, engine: engine, rangeWarn: rw, basis: basisInfo,
        freshness: { lastAgeSec: lastAge, stale: stale, note: stale ? 'آخرین کندل منبع ' + faDigits(Math.round(lastAge / 60)) + ' دقیقه پیش است — بازار ممکن است بسته باشد یا فید تأخیر/قطعی داشته باشد؛ تا بازشدن فید، سیگنال‌ها به‌روز نیستند.' : null },
        feedNote: 'کندل‌های اینترادی Yahoo ~۱۰ دقیقه تأخیر دارند؛ سطوح حدودی‌اند.', at: Date.now()

  h += '<p class="sc-foot">' + d.symbolLabel + ' · تایم‌فریم ' + d.tfLabel + ' · قیمت آخرین کندل بسته‌شده (کالیبره به اسپات): <span dir="ltr">' + scPx(e.lastClose) + '</span> · ATR۱۴: <span dir="ltr">' + scPx(e.atr) + '</span> · آخرین محاسبه: ' + faTime(new Date(d.at)) +
    '<br>' + (d.feedNote || '') + ' پورت الگوریتمی اندیکاتور کاربر روی کندل‌های Yahoo Finance — سطوح حدودی‌اند و سیگنال قطعی یا توصیه خرید/فروش نیستند؛ تایم‌فریم‌های کوچک نویز بیشتری دارند.</p>';
  return h;
}
function scSelectorsHTML(fixed) {
  var h = '<div class="sc-sels">';
  if (!fixed) {
    h += '<div class="sc-chips" data-sc-syms>';
    Object.keys(SCALP_SYMS).forEach(function (k) {
      h += '<button type="button" class="cchip' + (S_SCALP.sym === k ? ' on' : '') + '" data-sc-sym="' + k + '">' + SCALP_SYMS[k].label.split(' — ')[0] + '</button>';
    });
    h += '</div>';
  }
  h += '<div class="sc-chips" data-sc-tfs>';
  Object.keys(SCALP_TFS).forEach(function (t) {
    h += '<button type="button" class="cchip' + (S_SCALP.tf === t ? ' on' : '') + '" data-sc-tf="' + t + '">' + SCALP_TFS[t].label + '</button>';
  });
  h += '</div>';
  /* تراز مرز کندل ۴ساعته — مطابق چارت بروکر کاربر */
  var actAnchor = scAnchorOf(S_SCALP.sym);
  h += '<div class="sc-chips" data-sc-anchors title="مرز کندل ۴ساعته: بروکر/نیویورک = چارت OANDA و MT؛ UTC = مرز قدیمی ابزار">' +
    '<button type="button" class="cchip' + (actAnchor === 'broker' ? ' on' : '') + '" data-sc-anchor="broker">تراز بروکر/نیویورک</button>' +
    '<button type="button" class="cchip' + (actAnchor === 'utc' ? ' on' : '') + '" data-sc-anchor="utc">تراز UTC</button>' +
    '</div>';
  h += '<button type="button" class="iconbtn" data-sc-refresh aria-label="بروزرسانی اسکلپ"><span data-sc-spin style="display:inline-flex">' + icon('refresh', 14) + '</span></button>' +
    '</div>';
  return h;
}
function scContentHTML(fixed, d) {
  var head = '<div class="sc-head">' + icon('zap', 15) + '<b>' + (fixed ? 'سیگنال اسکلپ اونس — XAUUSD' : 'پیشنهاد اسکلپ') + '</b>' +
    '<span class="sc-sub">موتور اندیکاتور: SBW موج شکست · اوردر بلاک FVG · ستاپ ۴ساعته · واگرایی ۵ابزاری</span></div>' + scSelectorsHTML(fixed);
  if (!d) return head + '<div class="bt-state"><span class="spin">' + icon('refresh', 18) + '</span>در حال تحلیل کندل‌ها…<span class="s">موج، اوردر بلاک‌ها و ستاپ ۴ساعته روی داده Yahoo Finance</span></div>';
  return head + scBodyHTML(d, fixed);
}
function bindScalpControls(rerender) {
  var syms = appScroll.querySelectorAll('[data-sc-sym]');
  for (var i = 0; i < syms.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        if (S_SCALP.sym === b.dataset.scSym) return;
        S_SCALP.sym = b.dataset.scSym; scSave();
        rerender(true);
      });
    })(syms[i]);
  }
  var tfs = appScroll.querySelectorAll('[data-sc-tf]');
  for (var j = 0; j < tfs.length; j++) {
    (function (b) {
      b.addEventListener('click', function () {
        if (S_SCALP.tf === b.dataset.scTf) return;
        S_SCALP.tf = b.dataset.scTf; scSave();
        rerender(true);
      });
    })(tfs[j]);
  }
  var anchors = appScroll.querySelectorAll('[data-sc-anchor]');
  for (var a2 = 0; a2 < anchors.length; a2++) {
    (function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.scAnchor;
        if (scAnchorOf(S_SCALP.sym) === k) return;
        S_SCALP.anchor = k; scSave();
        rerender(true);
      });
    })(anchors[a2]);
  }
  var rf = appScroll.querySelector('[data-sc-refresh]');
  if (rf) rf.addEventListener('click', function () { rerender(true); });
}
/* باکس داخل اپ پیشنهاد معامله */
function renderScalpBox(force) {
  var slot = appScroll.querySelector('[data-sc-slot]');
  if (!slot) return;
  if (SCALP_BUSY && !force) { slot.innerHTML = scContentHTML(false, null); return; }
  slot.innerHTML = '<div class="bt-state"><span class="spin">' + icon('refresh', 18) + '</span>در حال تحلیل کندل‌ها…</div>';
  scalpCompute(!!force).then(function (d) {
    var s2 = appScroll.querySelector('[data-sc-slot]');
    if (!s2) return;
    s2.innerHTML = scContentHTML(false, d);
    bindScalpControls(renderScalpBox);
  }).catch(function () {
    var s3 = appScroll.querySelector('[data-sc-slot]');
    if (!s3) return;
    s3.innerHTML = '<div class="bt-state"><span style="color:var(--red)">' + icon('wifi', 20) + '</span>دریافت کندل‌ها از Yahoo Finance ممکن نشد — اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.<button type="button" class="btn" data-sc-retry>' + icon('refresh', 13) + 'تلاش مجدد</button></div>';
    var rb = s3.querySelector('[data-sc-retry]');
    if (rb) rb.addEventListener('click', function () { renderScalpBox(true); });
  });
}

/* ---------- اپ مستقل سیگنال اسکلپ اونس ---------- */
var SCALP_AUTO = null; /* تایمر بروزرسانی خودکار — فقط وقتی اپ باز است */
function scStopAuto() { if (SCALP_AUTO) { clearInterval(SCALP_AUTO); SCALP_AUTO = null; } }
function renderScalpApp() {
  scStopAuto();
  appScroll.innerHTML = '<div class="app-pad"><div data-sc-app>' + scContentHTML(true, null) + '</div>' +
    '<p class="ms-note">این پنجره مستقل، همان موتور اندیکاتور را روی نماد اونس (XAUUSD) اجرا می‌کند و هر ۶۰ ثانیه خودکار بروزرسانی می‌شود؛ اگر اندیکاتور شما در تریدینگ‌ویو سیگنال بدهد، این پنجره همان سیگنال را با سطوح حدودی نشان می‌دهد. خروجی اطلاع‌رسانی است و توصیه معامله نیست.</p></div>';
  bindScalpControls(renderScalpAppInner);
  renderScalpAppInner(true);
}
function renderScalpAppInner(force) {
  var box = appScroll.querySelector('[data-sc-app]');
  if (!box) return;
  if (!force && SCALP_BUSY) return;
  scalpCompute(!!force).then(function (d) {
    var b2 = appScroll.querySelector('[data-sc-app]');
    if (!b2) return;
    b2.innerHTML = scContentHTML(true, d);
    bindScalpControls(renderScalpAppInner);
    /* بروزرسانی خودکار ۶۰ ثانیه‌ای فقط برای اپ مستقل */
    scStopAuto();
    SCALP_AUTO = setInterval(function () {
      if (!appScroll.querySelector('[data-sc-app]')) { scStopAuto(); return; }
      renderScalpAppInner(true);
    }, 60000);
  }).catch(function () {
    var b3 = appScroll.querySelector('[data-sc-app]');
    if (!b3) return;
    b3.innerHTML = '<div class="bt-state"><span style="color:var(--red)">' + icon('wifi', 20) + '</span>دریافت کندل‌ها از Yahoo Finance ممکن نشد — اتصال اینترنت یا VPN را بررسی کنید و دوباره تلاش کنید.<button type="button" class="btn" data-sc-retry2>' + icon('refresh', 13) + 'تلاش مجدد</button></div>';
    var rb = b3.querySelector('[data-sc-retry2]');
    if (rb) rb.addEventListener('click', function () { renderScalpAppInner(true); });
  });
}

})();</script>

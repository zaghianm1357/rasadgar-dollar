name: Deploy standalone tool to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (auto-redirect + mobile + desktop + PWA)
        run: |
          mkdir -p _site/mobile _site/desktop _site/icons
          # نسخه‌های مستقل
          cp download/rasadgar-dollar.html _site/mobile/index.html
          cp download/rasadgar-dollar-desktop.html _site/desktop/index.html
          # صفحه انتخاب خودکار (تزریق لوگو)
          node -e "
            const fs = require('fs');
            const logo = fs.readFileSync('scripts/standalone/logo-b64.txt', 'utf8').trim();
            let idx = fs.readFileSync('assets/pages/index.html', 'utf8');
            idx = idx.split('__PAGES_LOGO_B64__').join(logo);
            fs.writeFileSync('_site/index.html', idx);
          "
          # PWA
          cp assets/pages/manifest.webmanifest _site/manifest.webmanifest
          cp assets/pages/icons/icon-192.png _site/icons/icon-192.png
          cp assets/pages/icons/icon-512.png _site/icons/icon-512.png
          cp assets/pages/icons/icon-512-maskable.png _site/icons/icon-512-maskable.png
          echo "rasadgar-dollar v$(node -p "require('./version.json').version")" > _site/VERSION.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
